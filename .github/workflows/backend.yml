name: Backend

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  UV_VERSION: '0.12.9'

jobs:
  backend:
    name: ruff + pytest + db-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # 与 docker-compose.yml 同镜像，保证 pgvector / 版本一致
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: WeKnora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d WeKnora"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://haike:haike@localhost:5432/haike
      APP_ENV: ci
      HAIKE_LLM: 'off'
      HAIKE_KNOWLEDGE: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            orchestrator/uv.lock
            contracts/uv.lock
      - name: Create haike database (same as deploy/postgres/init)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          export PGPASSWORD=postgres123
          psql -h localhost -U postgres -d WeKnora -v ON_ERROR_STOP=1 \
            -c "create role haike login password 'haike';" \
            -c "create database haike owner haike;"
          psql -h localhost -U postgres -d haike -c "create extension if not exists vector;"
      - name: Install locked dependencies
        run: uv sync --project orchestrator --frozen
      - name: Lint
        run: uv run --project orchestrator --no-sync ruff check orchestrator
      - name: Migrate empty database to head and verify (票 47)
        run: |
          uv run --project orchestrator --no-sync haike-db upgrade
          uv run --project orchestrator --no-sync haike-db check
      - name: Unit + Postgres integration tests
        run: uv run --project orchestrator --no-sync pytest -q orchestrator/tests

  image:
    name: build image (tag = release id)
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compute release id (与 scripts/release.sh 一致：<date>-<short sha>)
        id: rel
        run: echo "id=$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on non-PR)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: orchestrator/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/haike-orchestrator:${{ steps.rel.outputs.id }}
            ghcr.io/${{ github.repository_owner }}/haike-orchestrator:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
