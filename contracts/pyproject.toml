[project]
name = "haike-contracts"
version = "0.1.0"
description = "会话执行契约：事件 / 动作 / 快照的 Pydantic 模型与 JSON Schema（08 §4–§6）"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[project.scripts]
haike-contracts-export = "haike_contracts.export:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haike_contracts"]
