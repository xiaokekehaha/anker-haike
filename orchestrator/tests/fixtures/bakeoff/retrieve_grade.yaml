# retrieve.grade：命中片段（摘自 data/official/qa.yaml 官方 Q&A，英文原文）→ 逐条 relevant / irrelevant；coverage 只要求落在合理集合内。
# 评分 = 期望列表逐条判定正确率 + coverage 命中；unsure 一律算错（评分要能起到过滤作用）。
# 片段 doc_id 是 Q&A 条目 id，来源默认 kb_qa。
cases:
  - id: hair_wrap_clear
    input:
      text: 扫地机不吸了，滚刷上缠了好多头发
      symptoms: [不吸, 滚刷缠头发]
      product: eufy Clean X10 Pro Omni
      hits:
        - {id: c12, doc_id: rv-0272, snippet: "What should I do if my X10 Pro Omni T2351 reports warning/error:2112 Roller brush stuck? Turn the robot over, take out the roller brush, and check whether the foreign objects and hair on both ends of the roller brush are cleaned up."}
        - {id: c21, doc_id: rv-0229, snippet: "What should I do if my X10 Pro Omni T2351 reports warning/error:2213 side brush stuck? Turn the robot over and check if the side brush is entangled by foreign objects such as wires."}
        - {id: water, doc_id: rv-0071, snippet: "Can the dust bag be reused? An overview of the X10 Pro Omni dust bag features. The dust bag is disposable."}
    expect: {relevant: [c12], irrelevant: [water], coverage_in: [sufficient, insufficient]}
  - id: dustbin_clogged
    input:
      text: 集尘不行，尘盒老是堵
      symptoms: [尘盒堵塞]
      product: eufy Clean X10 Pro Omni
      hits:
        - {id: d1, doc_id: rv-0057, snippet: "Poor dust collection or dust box blockage: check whether the dust box is full and whether the dust collection channel is blocked. Enable pet mode in the app and clean the dust box and filter."}
        - {id: d2, doc_id: rv-0102, snippet: "Warning 7031 Return failed: the robot is blocked by obstacles while getting on the station. Clear the obstacles around the station."}
    expect: {relevant: [d1], irrelevant: [d2], coverage_in: [sufficient, insufficient]}
  - id: side_brush
    input:
      text: 侧面那个小刷子不动了
      symptoms: [侧刷不动]
      product: eufy Robot Vacuum Omni S1 Pro
      hits:
        - {id: B, doc_id: rv-0426, snippet: "S1 Pro has E3: Side brush tangled. Remove the robot's dirty water reservoir, turn the robot upside down, remove the side brush, and check for any foreign objects wrapped around it."}
        - {id: E, doc_id: rv-0331, snippet: "What should I do if the S1 Pro cannot connect to the 2.4GHz Wi-Fi network? Check the signal and confirm the password."}
        - {id: header, doc_id: rv-0124, snippet: "Does the S1/T2071/S1 Pro/T2080 recognize carpets?"}
    expect: {relevant: [B], irrelevant: [E, header], coverage_in: [sufficient, insufficient]}
  - id: none_relevant
    input:
      text: App 连不上机器
      symptoms: [App 无法连接]
      product: eufy Clean X10 Pro Omni
      hits:
        - {id: c12, doc_id: rv-0272, snippet: "Turn the robot over, take out the roller brush, and check whether the foreign objects and hair on both ends of the roller brush are cleaned up."}
        - {id: f1, doc_id: rv-0016, snippet: "Weak suction: clean the base station air duct, then check and clean the robot filter and dustbin."}
    expect: {irrelevant: [c12, f1], coverage_in: [none]}
  - id: safety_smell
    input:
      text: 吸奶器有股烧焦的味道
      symptoms: [焦味]
      product: eufy Wearable Breast Pump S1 Pro
      hits:
        - {id: s1, doc_id: bp-0028, snippet: "What should I do if my Breast Pump S1 Pro (T8D04) has a burning smell? Stop using the device immediately and unplug it."}
        - {id: s2, doc_id: bp-0090, snippet: "Weak or no suction: inspect the duckbill valve and diaphragm for damage. Check that the assembly is correct."}
    expect: {relevant: [s1], irrelevant: [s2], coverage_in: [sufficient, insufficient]}
  - id: negation_noise
    input:
      text: 不是吸力小，是跑起来声音很大
      symptoms: [异响]
      product: eufy Clean X10 Pro Omni
      hits:
        - {id: n1, doc_id: rv-0244, snippet: "The machine runs with a loud noise. The noise may come from the fan, roller brush, side brush, side wheel, or mop pads. If the fan noise is very sharp, check if the filter is severely clogged."}
        - {id: n2, doc_id: rv-0071, snippet: "Can the dust bag be reused? The dust bag is disposable."}
    expect: {relevant: [n1], irrelevant: [n2], coverage_in: [sufficient, insufficient]}
  - id: error_code_exact
    input:
      text: "App 报错 3212，滚筒拖布卡住"
      symptoms: [3212 报错]
      product: eufy Robot Vacuum Omni E28
      hits:
        - {id: x1, doc_id: rv-0147, snippet: "T2352 Omni E28 has 3212 Error: Rolling mop obstructed. Remove the dirty water reservoir and check if the roller is entangled with foreign objects. Clean out any debris."}
        - {id: x2, doc_id: rv-0189, snippet: "T2352 Omni E28 has 2112 Error: Roller brush stuck. Check whether the rolling brush is entangled with foreign objects."}
    expect: {relevant: [x1], coverage_in: [sufficient, insufficient]}
