# 63 单主办方工单评测集（data/official/tickets.yaml 的首封消息）。
# 每单标注：意图 intent、语言 language、确定性事实（pn / codes / order_no）、SOP 期望终点 sop、
# 精确命中的官方 Q&A（qa_exact，有错误码时）或现象应召回的 Q&A 候选（qa_gold，任一命中即可）、禁止出现的承诺 forbid。
# sop 取值：
#   logistics_delivered        物流显示送达 → 不补发，可提交承运商调查单（D3）
#   logistics_reship           未送达 / 退回 → 补发单
#   logistics_in_transit       运输中且未逾期 → 告知预计送达
#   logistics_presale          预售未发 → 告知预计发货日
#   ask_order                  没有可查的订单号 → 追问
#   troubleshoot               排障（首张步骤卡来自 qa_exact / qa_gold）
#   warranty_by_qa             官方 Q&A 判为硬件故障 → 直接进质保判断
#   code_miss                  错误码官方未收录 → 不套相近码，转人工
#   out_of_warranty            订单已过保 → 委婉拒绝
#   warranty_replace           保内 → 收齐 SOP 证据 → 换货单
#   dealer_check               查不到订单 → 问商家与国家 → 经销商名录
#   safety_human               安全风险 → 转人工
#   clarify                    信息不足（型号 / 现象）→ 追问
#   explain                    产品咨询 / 状态提示 → 解释即可
# 2026-10-08 复核：bp-0123（电机异响）、bp-0090（吸力弱或无吸力）与原金标同义，补为等价金标。
