# 评测对照组 C（开关：multi_query, faq, parent_expand, grade）。用法：haike-kb eval --arm C --config data/eval/retrieval/configs/C.yaml [--with-synthesize]
# 检索编排开关（票 32，03 §1.4.1 / §1.4.2、09 §4.1）。
version: 2026-09-18.1
query_rewrite:
  enabled: false            # 单轮评测不包含补查；新补查通过会话HTTP编排验证
  max_query_chars: 200
  budget_ms: 3000           # rewrite invoke 上限；Router 内部尝试共用
  min_remaining_ms: 8000    # run 剩余不足 8 s 跳过补救（08 §8）
  # 已审核的同义表达映射：改写里出现左侧词视为与右侧原词等价，不算「新增部件 / 原因」
  synonyms:
    碎屑: [渣, 垃圾, 灰, 碎渣]
    残留: [还是有, 还是, 没扫干净, 扫不干净, 留下]
    清扫后: [跑完了, 扫完, 扫完了, 跑完]
    清扫: [扫, 跑]
    清洁效果差: [扫不干净, 扫完还脏, 还是一堆, 一堆渣, 没扫干净]
    吸力下降: [不吸, 吸不起, 吸力小, 吸力弱, 吸力变小]
    滚刷: [主刷]
    边刷: [侧刷]
    滤网: [过滤网, 滤芯]
    尘盒: [垃圾盒, 集尘盒]
    扫地机器人: [扫地机, 扫拖机器人, 机器人]
# ---- 阶段 3（docs/planning/2026-09-13_bounded-agentic-rag）：默认全部关闭，凭评测报告逐项开启 ----
multi_query:
  categories: [robot_vacuum]
  enabled: true            # 用上面的 synonyms 做确定性变体（不调模型），变体 × 两库并发，本地 RRF 合并
  max_variants: 2           # 不含原 query
  max_requests_per_round: 6
  rrf_k: 60
faq:
  enabled: true            # 本地 FAQ 索引（faq_rv.yaml）进入首轮；WeKnora FAQ 检索接口在 v0.8.0 返回空
  top_k: 3
  threshold: 0.3
rerank:
  enabled: false            # 适配器侧调百炼 gte-rerank-v2；WeKnora hybrid-search 只做 RRF 不重排
  model: gte-rerank-v2
  timeout_ms: 2000
  min_remaining_ms: 5000
parent_expand:
  enabled: true            # 手册命中的同父子块拼接成父块正文给 synthesize（父块无读取接口，子块列表还原）
  max_items: 3
  max_chars: 800
grade:
  enabled: true            # 充分性观测与质量标记，不删除候选；单轮评测不会补查
  budget_ms: 4000             # qwen-flash 评 8 条约 2 s，2500 会大量超时（阶段 5 实测）
  min_remaining_ms: 6000
  max_items: 12
  max_chars: 500
  second_round: false       # 第二轮新增命中是否再评一次（多一次模型调用）
retrieval:
  candidate_k: 15
  final_k: 12
  context_chars: 5000
  item_chars: 800
  second_round_budget_ms: 3000   # 补检索整轮上限
  min_remaining_for_second_round_ms: 3000  # 剩余不足 3 s 跳过第二轮并记录（08 §8）
synthesize:
  budget_ms: 8000
  max_hypotheses: 3
