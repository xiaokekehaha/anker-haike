# 检索评测集（有界 Agentic RAG，docs/planning/2026-09-13_bounded-agentic-rag/design.md §9）。
#
# 状态：标注中。首批 56 条由 Claude 依据 data/knowledge 语料起草（2026-09-13）；bin-01 与 chg-03 是两条标注示范。
# 标注怎么做见 docs/planning/2026-09-13_bounded-agentic-rag/ANNOTATION.md，工作单用 make eval-worksheet 生成。
# 每条 `annotated: false`，人工核对后改 true 并在 annotator 写名字。未标注的样例只能用于回归对比，不能作为开启开关的依据。
#
# 字段：
#   id                 唯一编号
#   product_state      confirmed_sku | category_only
#   sku / category     confirmed_sku 给 sku；category_only 只给 category
#   text               用户原话（口语）
#   symptoms           intake 抽取后的有效症状（若为空，query 退回原文）
#   expected_doc_ids   金标文档：manual_rv_v1 / manual_rv_v2 / troubleshooting_rv / faq_rv / T0001 等；任一进 top5 记 hit
#   expected_ticket_cause 可选：工单按根因匹配（命中片段含「原因：<该值>」即算金标），省得逐条列工单 id
#   expected_chunk_hint 人可读的段落提示（c12 为手册标记，A–E 为排障手册章节，1–5 为 v2 手册章节，q7 为 FAQ 条目）
#   expected_plan      期望 synthesize 排第一的 plan_id；null 表示无适用计划
#   expected_outcome   evidence（有证据选计划）| standard_flow（无证据按预写计划）| escalate（R4/R5/R8）| no_query
#   irrelevant_hint    若首轮容易召回但不相关的内容，写在这里供错配统计
#   tags               口语 | 错别字 | 多症状 | 否定 | 精确词 | 反证工单 | 无知识 | faq_only | 品类级 | 安全 | 无计划 | A1 | A2
#   annotated / annotator / note
#
# 范围提醒：manual_rv_v1 只对 X10 / X9 / X8 可见；manual_rv_v2 只对 L60 / L50 / G 系列可见；troubleshooting_rv 品类通用；
# 工单按 SKU 隔离；FAQ 目前不在运行时检索范围（design.md §14）。

