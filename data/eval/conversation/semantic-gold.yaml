schema_version: 1
description: Synthetic multi-turn expectations authored before model runs; 15 families
  x 5 expressions.
cases:
- id: history-1
  family: history
  text: 我之前问了什么问题
  expected: &id001
    primary_intent: history_query
- id: history-2
  family: history
  text: 最开始我问的是什么
  expected: *id001
- id: history-3
  family: history
  text: 你刚才怎么回答我的
  expected: *id001
- id: history-4
  family: history
  text: 请按时间回顾我们的问答
  expected: *id001
- id: history-5
  family: history
  text: 帮我找第一轮的问题和你的回复
  expected: *id001
- id: explain-1
  family: explain
  text: 为什么要检查滚刷
  expected: &id002
    primary_intent: explain
    feedback: null
- id: explain-2
  family: explain
  text: 这一步是为了判断什么
  expected: *id002
- id: explain-3
  family: explain
  text: 你说的缠绕是什么意思
  expected: *id002
- id: explain-4
  family: explain
  text: 先解释卡片的操作目的
  expected: *id002
- id: explain-5
  family: explain
  text: 这个步骤我没理解，能解释一下吗
  expected: *id002
- id: new-1
  family: new
  text: 新问题
  expected: &id003
    primary_intent: new_issue
- id: new-2
  family: new
  text: 我想问个新问题
  expected: *id003
- id: new-3
  family: new
  text: 先换个话题，我有另外的问题
  expected: *id003
- id: new-4
  family: new
  text: 现在开始另一个问题，等我描述
  expected: *id003
- id: new-5
  family: new
  text: 这个先放着，我要提新问题
  expected: *id003
- id: resume-1
  family: resume
  text: 回到耳机没有声音的问题
  expected: &id004
    primary_intent: resume_issue
    target_issue_id: ear
- id: resume-2
  family: resume
  text: 继续最初那个耳机问题
  expected: *id004
- id: resume-3
  family: resume
  text: 机器人先放着，处理之前的耳机
  expected: *id004
- id: resume-4
  family: resume
  text: 我要接着排查耳机没声音
  expected: *id004
- id: resume-5
  family: resume
  text: 请切回先前的耳机问题
  expected: *id004
- id: correction-1
  family: correction
  text: 刚才说滚刷不转不对，其实是转得慢
  expected: &id005
    primary_intent: correct
    correction_target: robot-fact
- id: correction-2
  family: correction
  text: 更正机器人现象：不是不转，是转速很慢
  expected: *id005
- id: correction-3
  family: correction
  text: 我说错了，滚刷能转，就是转得慢
  expected: *id005
- id: correction-4
  family: correction
  text: 把滚刷不转改为滚刷转速慢
  expected: *id005
- id: correction-5
  family: correction
  text: 刚才滚刷不转的描述撤回，实际转得慢
  expected: *id005
- id: ambiguous_correction-1
  family: ambiguous_correction
  text: 刚说错了
  expected: &id006
    primary_intent: correct
    clarification_required: true
- id: ambiguous_correction-2
  family: ambiguous_correction
  text: 不对我表达错了
  expected: *id006
- id: ambiguous_correction-3
  family: ambiguous_correction
  text: 上面那句不准确
  expected: *id006
- id: ambiguous_correction-4
  family: ambiguous_correction
  text: 刚才口误了
  expected: *id006
- id: ambiguous_correction-5
  family: ambiguous_correction
  text: 我要更正一下，等我想想
  expected: *id006
- id: feedback-1
  family: feedback
  text: 按卡片检查清理过了，还是不转
  expected: &id007
    primary_intent: step_feedback
    feedback: not_solved
- id: feedback-2
  family: feedback
  text: 做完这一步，问题还没解决
  expected: *id007
- id: feedback-3
  family: feedback
  text: 按你说的检查了，滚刷依旧不转
  expected: *id007
- id: feedback-4
  family: feedback
  text: 这一步我操作完了，没有解决问题
  expected: *id007
- id: feedback-5
  family: feedback
  text: 照卡片做了，现在仍然有原来的问题
  expected: *id007
- id: pending_answer-1
  family: pending_answer
  text: 我的型号是X9 Pro，选它
  expected: &id008
    primary_intent: answer_pending
    pending_kind: select_product
  pending: product
- id: pending_answer-2
  family: pending_answer
  text: 选卡片里的X9 Pro
  expected: *id008
  pending: product
- id: pending_answer-3
  family: pending_answer
  text: 确认是第一个X9 Pro
  expected: *id008
  pending: product
- id: pending_answer-4
  family: pending_answer
  text: 选T2351这款
  expected: *id008
  pending: product
- id: pending_answer-5
  family: pending_answer
  text: 卡片型号我选X9 Pro
  expected: *id008
  pending: product
- id: risk_reported-1
  family: risk_reported
  text: 这台机器人冒烟了
  expected: &id009
    risk_assertion: reported
- id: risk_reported-2
  family: risk_reported
  text: 机器人现在真的在冒烟
  expected: *id009
- id: risk_reported-3
  family: risk_reported
  text: 刚才这台机器突然冒烟
  expected: *id009
- id: risk_reported-4
  family: risk_reported
  text: 我看见X9 Pro正在冒烟
  expected: *id009
- id: risk_reported-5
  family: risk_reported
  text: 同一台机器人出现冒烟现象
  expected: *id009
- id: risk_negated-1
  family: risk_negated
  text: 机器人没有冒烟
  expected: &id010
    risk_assertion: negated
- id: risk_negated-2
  family: risk_negated
  text: 确认这台机器不冒烟，只是滚刷不转
  expected: *id010
- id: risk_negated-3
  family: risk_negated
  text: 没有冒烟这种情况
  expected: *id010
- id: risk_negated-4
  family: risk_negated
  text: 机器从来没冒烟
  expected: *id010
- id: risk_negated-5
  family: risk_negated
  text: 我检查过了，并没有冒烟
  expected: *id010
- id: human-1
  family: human
  text: 请转人工客服
  expected: &id011
    primary_intent: request_human
- id: human-2
  family: human
  text: 我要找真人客服处理
  expected: *id011
- id: human-3
  family: human
  text: 不要继续排查了，我要人工
  expected: *id011
- id: human-4
  family: human
  text: 帮我联系人工客服
  expected: *id011
- id: human-5
  family: human
  text: 我明确要求人工服务
  expected: *id011
- id: handoff_status-1
  family: handoff_status
  text: 现在转给人工了吗
  expected: &id012
    primary_intent: handoff_status
- id: handoff_status-2
  family: handoff_status
  text: 客服接单了吗
  expected: *id012
- id: handoff_status-3
  family: handoff_status
  text: 你已经帮我转人工了吗
  expected: *id012
- id: handoff_status-4
  family: handoff_status
  text: 人工转接现在是什么状态
  expected: *id012
- id: handoff_status-5
  family: handoff_status
  text: 能确认真人客服已经收到吗
  expected: *id012
- id: social-1
  family: social
  text: 谢谢你
  expected: &id013
    primary_intent: social
- id: social-2
  family: social
  text: 你好
  expected: *id013
- id: social-3
  family: social
  text: 辛苦了
  expected: *id013
- id: social-4
  family: social
  text: 好的谢谢
  expected: *id013
- id: social-5
  family: social
  text: 你还在吗
  expected: *id013
- id: preference-1
  family: preference
  text: 回答请简短一点
  expected: &id014
    primary_intent: preference
- id: preference-2
  family: preference
  text: 以后解释详细一点
  expected: *id014
- id: preference-3
  family: preference
  text: 请少说一点，我喜欢简洁
  expected: *id014
- id: preference-4
  family: preference
  text: 后面请详细解释原因
  expected: *id014
- id: preference-5
  family: preference
  text: 请用更简短的话回复我
  expected: *id014
- id: mixed-1
  family: mixed
  text: 为什么这一步要检查滚刷？另外机器人还有异响
  expected: &id015
    intent_one_of:
    - explain
    - supplement
    feedback: null
- id: mixed-2
  family: mixed
  text: 先解释上面那一步，我补充一下机器人会异响
  expected: *id015
- id: mixed-3
  family: mixed
  text: 讲讲检查滚刷的原因，同时记录一下有异响
  expected: *id015
- id: mixed-4
  family: mixed
  text: 这一步为什么有用？补充现象是异响
  expected: *id015
- id: mixed-5
  family: mixed
  text: 先解释这个步骤，别忘了记下机器异响
  expected: *id015
