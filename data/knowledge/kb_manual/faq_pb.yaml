# 移动电源 FAQ。入库到 kb_faq；tag 用 category / scope 标记。人工演示样本（2026-09-17），待真实资料替换。
doc_id: faq_pb
scope: category_generic
category: power_bank
doc_version: 2026-09-17.1
entries:
  - {id: q1,  q: 充电宝给手机充不进电怎么办, similar: [插上没反应, 不给手机充电, 没有输出], a: 先清理输出接口的灰尘绒毛，再换一根数据线和另一台设备测试；仍无输出可长按电源键 10 秒复位。}
  - {id: q2,  q: 充电宝自己充不进电怎么办, similar: [回充不了, 充不满], a: 用支持 PD 的充电器和认证数据线给充电宝充电，观察输入指示灯是否在 10 秒内亮起；用电脑 USB 口充电很慢是正常的。}
  - {id: q3,  q: 充电宝可以带上飞机吗, similar: [能过安检吗], a: 额定能量不超过 100Wh 的充电宝可随身携带登机，不能托运；100Wh 到 160Wh 需航空公司批准。}
  - {id: q4,  q: 充电宝怎么复位, similar: [怎么重启充电宝, 死机了], a: 长按电源键 10 秒以上可以复位充电宝，复位后重新连接设备再试。}
  - {id: q5,  q: 充电宝多久充满, a: 取决于容量和输入功率，20000mAh 用 65W 输入约 1.5 小时，用 5V 1A 需 10 小时以上。}
  - {id: q6,  q: 充电宝充电时发热正常吗, similar: [有点烫], a: 快充时轻微温热属正常；如烫到无法长时间握持、外壳变形或有异味，请立即停止使用并联系售后。}
  - {id: q7,  q: 指示灯一直闪是什么意思, similar: [灯一直闪, 指示灯快闪], a: 指示灯持续快速闪烁通常表示输入异常或温度保护，请拔掉线材，让充电宝在室温下静置 30 分钟再充。}
  - {id: q8,  q: 充电宝电量显示不准, similar: [电量跳变, 显示不对], a: 做一次完整充放电循环（充满后用到自动关机）可以校准电量显示。}
  - {id: q9,  q: 充电宝掉电很快, similar: [电量虚, 用一会就没电], a: 掉电快时先确认是否有设备持续连接取电，蓝牙耳机等小电流设备请开启小电流模式。}
  - {id: q10, q: 怎么开启小电流模式, similar: [涓流模式], a: 多数机型双击电源键进入小电流模式，指示灯会有区别于常规的提示；具体以机身说明为准。}
  - {id: q11, q: 充电宝鼓包了还能用吗, similar: [外壳鼓起来了], a: 不能。立即停止使用和充电，放到阴凉通风处远离可燃物，联系售后回收处理，不要拆解或按压。}
  - {id: q12, q: 接口松了插不紧, similar: [接口松动, 插头晃], a: 先清理接口异物并换线测试；若线材插入后仍晃动、需要按住才能充电，属接口磨损，请联系售后。}
