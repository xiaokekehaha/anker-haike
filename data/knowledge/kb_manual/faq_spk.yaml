# 音箱 FAQ。入库到 kb_faq；tag 用 category / scope 标记。人工演示样本（2026-09-17），待真实资料替换。
doc_id: faq_spk
scope: category_generic
category: speaker
doc_version: 2026-09-17.1
entries:
  - {id: q1,  q: 音箱开不了机怎么办, similar: [不开机, 按了没反应], a: 用原装线充电 30 分钟以上再长按电源键；仍无响应可长按电源键 10 秒强制重启。}
  - {id: q2,  q: 音箱连不上手机, similar: [配对失败, 搜不到], a: 在手机蓝牙列表删除音箱，长按音箱蓝牙键进入配对模式后重新连接。}
  - {id: q3,  q: 音箱可以连两台手机吗, a: 支持多点连接的机型可同时连接两台设备，具体以机身或 App 说明为准。}
  - {id: q4,  q: 连上了但没有声音, similar: [没声音, 不出声], a: 没声音时先检查手机媒体音量、是否静音，以及音频输出是否被切到了其他设备。}
  - {id: q5,  q: 两台音箱怎么组立体声, similar: [TWS 组队], a: 两台同型号音箱开机后在 App 里选择立体声配对，或长按其中一台的 TWS 键。}
  - {id: q6,  q: 音箱有破音杂音, similar: [失真, 电流声], a: 音源本身过载会导致破音，请把手机音量降到 80% 以下并在 App 里关闭低音增强再试。}
  - {id: q7,  q: 音箱防水吗, a: 标注 IPX7 的机型可短时浸水，但充电口进水后必须完全干燥才能充电；盐水和泳池水请及时用清水冲洗擦干。}
  - {id: q8,  q: 音箱续航变短了, similar: [掉电快], a: 关闭灯效、降低音量并更新固件可以明显延长续航；长期不用请每三个月充一次电。}
  - {id: q9,  q: 音箱进水了怎么办, similar: [掉水里了], a: 立即关机擦干，开口朝下放在通风处至少 48 小时，期间不要充电；仍异常请联系售后。}
  - {id: q10, q: 怎么恢复出厂设置, a: 开机状态下同时长按电源键和音量加键约 5 秒，指示灯全亮后松开即恢复出厂设置，配对记录会被清除。}
