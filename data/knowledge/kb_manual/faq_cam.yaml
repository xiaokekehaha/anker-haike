# 家庭安防摄像头 FAQ。入库到 kb_faq；tag 用 category / scope 标记。人工演示样本（2026-09-17），待真实资料替换。
doc_id: faq_cam
scope: category_generic
category: security_cam
doc_version: 2026-09-17.1
entries:
  - {id: q1,  q: 摄像头显示离线怎么办, similar: [掉线, 连不上], a: 确认路由器 2.4GHz 已开启且设备在信号范围内，重启 HomeBase 或设备，仍离线则在 App 里删除后重新配网。}
  - {id: q2,  q: 摄像头支持 5G Wi-Fi 吗, a: 多数机型只支持 2.4GHz，请确认路由器没有关闭 2.4GHz 频段。}
  - {id: q3,  q: 配网一直失败, similar: [添加不了设备], a: 手机连接 2.4GHz Wi-Fi、关闭手机移动数据，靠近设备后按住同步键 5 秒进入配网模式再添加。}
  - {id: q4,  q: 画面模糊看不清, similar: [画面不清楚], a: 用干燥超细纤维布擦拭镜头，确认出厂保护膜已撕掉；夜间模糊多为镜头前有反光物。}
  - {id: q5,  q: 夜视画面发白起雾, similar: [晚上看不清, 夜视不行], a: 夜视画面发白、起雾多因镜头前有反光物或玻璃，请让镜头前 1 米内没有墙面、玻璃或树叶。}
  - {id: q6,  q: 有人经过没有录像, similar: [不录像, 没录到], a: 检查活动区域是否覆盖经过路线、灵敏度是否过低，以及是否处于省电或休眠模式。}
  - {id: q7,  q: 收不到推送通知, similar: [没有通知, 没推送], a: 收不到推送时检查手机系统里 eufy Security 的通知权限，并把它加入电池优化白名单。}
  - {id: q8,  q: 老是误报怎么办, similar: [一直报警, 误触发], a: 缩小活动区域避开车道和树木、降低灵敏度，并在支持的机型上开启仅检测人形。}
  - {id: q9,  q: 电池掉电很快, similar: [续航短, 老是没电], a: 掉电快通常是触发次数过多，请降低灵敏度、缩小活动区域并缩短录像时长。}
  - {id: q10, q: 摄像头怎么充电, a: 取下设备用原装线和 5V 2A 以上充电器充满一次，充满后再放回安装位置；低温下续航会明显缩短。}
  - {id: q11, q: 门铃按了不响, similar: [门铃不响, 室内机不响], a: 门铃不响时在 App 里检查室内机音量是否为零，并确认室内机与门铃已配对且在线。}
  - {id: q12, q: 录像存在哪里, a: 带 HomeBase 的机型存在本地 HomeBase，其余机型存本机存储卡或云端，具体以机型说明为准。}
