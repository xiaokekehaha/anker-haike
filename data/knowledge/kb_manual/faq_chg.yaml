# 充电器 FAQ。入库到 kb_faq；tag 用 category / scope 标记。人工演示样本（2026-09-17），待真实资料替换。
doc_id: faq_chg
scope: category_generic
category: charger
doc_version: 2026-09-17.1
entries:
  - {id: q1,  q: 充电器插上没反应怎么办, similar: [不充电, 充不上], a: 依次换数据线、换插座、换被充设备测试；只有在不同插座和设备上都不工作时才是充电器故障。}
  - {id: q2,  q: 充电器用什么线, similar: [配什么数据线], a: 使用支持对应功率的经认证数据线；100W 以上需要 5A 电流的 USB-C 线。}
  - {id: q3,  q: 充电一会断一会连, similar: [时断时续, 断断续续], a: 插脚松动或插座接触不良会导致时断时续，请把充电器完全插入插座，避免使用松动的插线板。}
  - {id: q4,  q: 充电器发热正常吗, similar: [很热], a: 满负载时外壳温热属正常；若烫到无法触碰、有焦味或外壳变形，请立即拔下停止使用。}
  - {id: q5,  q: 为什么没有进入快充, similar: [不快充, 充得慢], a: 快充需要充电器、线材、设备三者协议匹配，任一不支持都会降为普通充电；请确认设备屏幕是否显示快充。}
  - {id: q6,  q: 插两个设备速度变慢了, similar: [多口充电慢], a: 多口充电器同时使用时功率会在各口之间分配，请只插一个设备测试是否恢复快充。}
  - {id: q7,  q: 充电器有滋滋声正常吗, similar: [有电流声], a: 极轻微的高频声在安静环境中可能听到，属正常；声音明显、伴随焦味或发热异常请停止使用。}
  - {id: q8,  q: 指示灯不亮, similar: [灯不亮], a: 指示灯不亮先确认插座有电并更换插座；仍不亮但能正常充电属于指示灯故障，可联系售后。}
  - {id: q9,  q: 充电器可以在国外用吗, similar: [电压范围], a: 支持 100–240V 宽电压的机型可在全球使用，只需对应插头转换器。}
  - {id: q10, q: 充电器进水了怎么办, a: 立即拔下不要使用，放在通风处晾干至少 48 小时；有异味或异常发热请联系售后。}
