# 吸奶器 FAQ。入库到 kb_faq；tag 用 category / scope 标记。人工演示样本（2026-09-17），待真实资料替换。
doc_id: faq_bp
scope: category_generic
category: breast_pump
doc_version: 2026-09-17.1
entries:
  - {id: q1,  q: 吸奶器吸力变小了怎么办, similar: [没有吸力, 吸不出], a: 先检查鸭嘴阀和隔膜有无破损变形并重新装到位，再确认喇叭罩尺寸合适、与乳房完全贴合。}
  - {id: q2,  q: 鸭嘴阀多久更换, similar: [配件寿命], a: 鸭嘴阀和隔膜属易耗件，建议每 1–3 个月更换一次，出现裂口、发白变硬时立即更换。}
  - {id: q3,  q: 配件怎么清洗, similar: [能消毒吗], a: 每次使用后拆开所有接触奶液的配件清洗并完全晾干，潮湿的隔膜会贴住导致吸力异常。}
  - {id: q4,  q: 主机可以水洗吗, a: 主机不可水洗，用湿布擦拭即可；只有接触奶液的配件可以清洗和消毒。}
  - {id: q5,  q: 吸奶器开不了机, similar: [不开机, 按了没反应], a: 用原装线充电 30 分钟后长按电源键 3 秒开机；电池耗尽后需先充一段时间。}
  - {id: q6,  q: 吸奶器充不进电, similar: [不充电], a: 充不进电先检查充电口是否有奶渍或异物，用干棉签清理后换一根数据线再试。}
  - {id: q7,  q: 吸奶器漏奶怎么办, similar: [漏气, 往外漏], a: 检查隔膜是否完全压入卡槽、鸭嘴阀是否装正，并确认喇叭罩边缘与乳房之间没有缝隙。}
  - {id: q8,  q: 吸奶器声音突然变大, similar: [异响, 噪音大], a: 运转声音突然变大多为隔膜未装到位或机器未放平，请重新安装隔膜并把主机放在平稳处。}
  - {id: q9,  q: 使用时感到疼痛, a: 请立即停止并降低吸力档位，检查喇叭罩尺寸是否合适；持续疼痛请咨询医护人员。}
  - {id: q10, q: App 连不上吸奶器, similar: [蓝牙连不上, 配对失败], a: 在 eufy Baby App 里删除设备，长按电源键 5 秒进入配对模式后重新添加，手机蓝牙保持开启。}
