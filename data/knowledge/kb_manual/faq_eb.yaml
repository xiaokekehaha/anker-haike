# 无线耳机 FAQ。入库到 kb_faq；tag 用 category / scope 标记。人工演示样本（2026-09-17），待真实资料替换。
doc_id: faq_eb
scope: category_generic
category: earbuds
doc_version: 2026-09-17.1
entries:
  - {id: q1,  q: 耳机只有一边有声音怎么办, similar: [单边没声, 一只不响], a: 先清洁两只耳机与充电盒的触点并放回盒中充电；仍单边无声则删除蓝牙记录、重置耳机后重新配对。}
  - {id: q2,  q: 耳机连不上手机, similar: [配对失败, 搜不到], a: 在手机蓝牙列表删除耳机，把耳机放回盒中长按盒上按键 10 秒重置，再打开盒盖重新配对。}
  - {id: q3,  q: 耳机老是断连, similar: [断断续续, 老是断], a: 远离微波炉、路由器等干扰源，手机不要放在口袋另一侧；更新固件后重新配对。}
  - {id: q4,  q: 耳机放回盒子不充电, similar: [不充电, 灯不亮], a: 先用干燥棉签清洁触点并确认耳机放到位；充电盒本身没电时耳机也充不进电。}
  - {id: q5,  q: 充电盒没电了耳机怎么充, a: 充电盒本身没电时耳机也充不进电，请先用数据线给充电盒充电 30 分钟。}
  - {id: q6,  q: 耳机防水吗, similar: [能戴着洗澡吗], a: 多数机型耳机本体防汗防泼溅（IPX4 或以上），充电盒不防水；不能戴着游泳或淋浴。}
  - {id: q7,  q: 耳机续航多久, a: 单次 7–10 小时，配合充电盒 30–50 小时，开启降噪会缩短约 20%–30%。}
  - {id: q8,  q: 声音变小变闷了, similar: [音量小, 声音闷], a: 取下耳塞套清理出音孔网罩上的耳垢；再在 App 里检查均衡器和音量限制。}
  - {id: q9,  q: App 里音量限制在哪, similar: [均衡器], a: 在 soundcore App 里检查均衡器是否被调低、是否开启了音量限制，恢复默认后再听。}
  - {id: q10, q: 怎么更新耳机固件, a: 打开 soundcore App 连接耳机，进入设备设置查看固件更新，更新期间保持耳机在盒内且电量充足。}
  - {id: q11, q: 降噪没效果或触控没反应, similar: [降噪失效, 触摸失灵], a: 降噪或触控异常时先在 App 里更新固件并恢复默认设置，更新期间保持耳机在盒内。}
  - {id: q12, q: 降噪效果不好怎么办, similar: [降噪不行], a: 降噪效果依赖佩戴密合，请更换合适尺寸的耳塞套并在 App 里重新做佩戴检测。}
