# 扫地机 FAQ（约 50 条）。入库到 kb_manual 的 faq 类型知识库；tag 用 category / scope 标记。
doc_id: faq_rv
scope: category_generic
category: robot_vacuum
doc_version: 2026-09-12.1
entries:
  - {id: q1,  q: 扫地机吸力变小了怎么办, similar: [吸不起灰, 吸力下降, 扫不干净], a: 请按顺序检查滚刷是否缠绕毛发、滤网是否堵塞、尘盒是否已满或未装到位、吸口是否有异物，每完成一项试运行观察。}
  - {id: q2,  q: 滚刷多久清理一次, similar: [滚刷保养周期], a: 建议每周检查一次；有长发或宠物的家庭建议每 3 天检查一次。}
  - {id: q3,  q: 滤网可以水洗吗, similar: [滤网怎么洗, HEPA 能洗吗], a: 可水洗机型的滤网可用清水冲洗，需完全晾干 24 小时后再装回，切勿潮湿装回。}
  - {id: q4,  q: 边刷不转怎么办, similar: [边刷卡住, 边刷不动], a: 先关机拆下边刷清理缠绕物，检查边刷轴是否有异物或进水；清理后仍不转请联系售后。}
  - {id: q5,  q: 提示请检查尘盒是什么意思, similar: [尘盒报警, 尘盒提示], a: 表示尘盒未装到位或已满。请倒空尘盒并重新安装，听到咔哒声即到位。}
  - {id: q6,  q: 机器有焦味怎么办, similar: [有糊味, 闻到烧焦], a: 请立即关机停止使用并联系售后，不要继续排查或充电。}
  - {id: q7,  q: 吸口被异物卡住会怎样, similar: [吸口堵了, 吸口有东西], a: 清扫声音会变大、吸力明显下降，请检查吸口并取出异物。}
  - {id: q8,  q: 尘盒多久倒一次, a: 建议每次清扫后倒空；宠物家庭尤其如此，尘盒过满会导致吸力下降。}
  - {id: q9,  q: 滤网多久更换, similar: [滤网寿命], a: 建议每两周清洁一次、每 3 至 6 个月更换一次；破损或变形时立即更换。}
  - {id: q10, q: 机器一直红灯常亮, similar: [红灯不灭], a: 通常是主机故障或被卡住，请把主机移到开阔处重启；仍红灯请联系售后。}
  - {id: q11, q: 红灯闪烁是什么意思, a: 表示电量低，请放回基站充电。}
  - {id: q12, q: 尘盒装不上去, similar: [尘盒卡不住], a: 请检查尘盒内是否有异物顶住，对准滑轨完全推入直到听到咔哒声；未装到位会触发提示。}
  - {id: q13, q: 机器不充电怎么办, similar: [放上去不充电, 回基站不亮], a: 确认基站电源灯亮、触点无灰尘，手动放回基站观察 5 分钟；仍不充电请联系售后。}
  - {id: q14, q: 机器找不到基站, similar: [回不了充电座], a: 请把基站放在靠墙、前方 1.5 米无障碍的位置，避免阳光直射红外接收窗。}
  - {id: q15, q: 边刷用多久要换, a: 刷毛明显变形或弯曲时更换，一般 3 至 6 个月。}
  - {id: q16, q: 滚刷两端缠了很多头发, a: 滚刷两端轴承处的毛发需一并清理，否则转动阻力增大、吸力下降。可拆下末端轴套单独清理。}
  - {id: q17, q: 拖布有异味, similar: [拖布臭], a: 请每次使用后取下拖布清洗并晾干；长期潮湿会产生异味。}
  - {id: q18, q: 水箱漏水, a: 请检查水箱密封圈是否移位或老化，重新安装到位。}
  - {id: q19, q: 出水量怎么调, a: 在 App 的清洁设置中可三档调节出水量。}
  - {id: q20, q: 机器运行时声音很大, similar: [噪音变大], a: 先检查吸口和滚刷是否有异物；若伴随异响或焦味请立即关机并联系售后。}
  - {id: q21, q: 机器发烫正常吗, similar: [机身很烫], a: 轻微温热正常；若明显烫手、有焦味或冒烟，请立即断电停用并联系售后。}
  - {id: q22, q: 电池鼓包了怎么办, a: 请立即停止使用与充电，远离火源，联系售后回收处理，切勿自行拆解。}
  - {id: q23, q: 可以自己换电池吗, a: 不建议自行拆解电池仓，请联系售后处理。}
  - {id: q24, q: 机器在地毯上吸力不足, a: 请在 App 中开启地毯增压或强力档；并检查滤网与尘盒。}
  - {id: q25, q: 机器总是在同一个地方卡住, a: 请清理该区域的线缆、拖鞋等障碍，或在 App 中设置禁区。}
  - {id: q26, q: 清扫路线乱, similar: [乱跑], a: 请擦拭前方激光雷达 / 摄像头窗口，并在光线充足时重新建图。}
  - {id: q27, q: 机器从台阶掉下去, a: 请用干布擦拭底部悬崖传感器；深色地毯可能误判，可在 App 关闭地毯识别。}
  - {id: q28, q: 滚刷盖打不开, a: 请同时按下滚刷盖两侧卡扣再向上提；请勿硬撬。}
  - {id: q29, q: 扫拖一体机拖地不出水, a: 检查水箱是否装水、滤芯是否堵塞、出水量是否被设为关闭。}
  - {id: q30, q: 基站集尘不工作, a: 检查集尘袋是否已满、袋口是否装到位，以及尘盒是否清空。}
  - {id: q31, q: 集尘袋多久换, a: 一般 30 至 60 天，App 会提示更换。}
  - {id: q32, q: 机器清扫时突然停下, a: 常见为电量低、被卡住或尘盒未装到位；请查看语音提示与 App 通知。}
  - {id: q33, q: 语音提示请检查滚刷, a: 表示滚刷被缠绕或卡住，请取出滚刷清理后装回。}
  - {id: q34, q: 机器无法开机, a: 请先充电 30 分钟后长按电源键 3 秒；仍无法开机请联系售后。}
  - {id: q35, q: App 连不上机器, a: 请确认手机连接 2.4G Wi-Fi，重置机器网络后重新配网。}
  - {id: q36, q: 机器扫到一半回充, a: 电量不足会自动回充并断点续扫；若电池衰减明显请联系售后。}
  - {id: q37, q: 滤网洗完多久能装, a: 需完全晾干，建议 24 小时。}
  - {id: q38, q: 可以用洗涤剂洗滤网吗, a: 不建议，只用清水冲洗。}
  - {id: q39, q: 机器有异响, similar: [咔咔响, 摩擦声], a: 先关机检查滚刷、边刷和轮子是否有异物；持续异响请停用并联系售后。}
  - {id: q40, q: 吸口在哪里, a: 翻转主机，滚刷所在的开口即吸口，吸口后方连接尘盒进风口。}
  - {id: q41, q: 尘盒进风口堵了, a: 取出尘盒后用干布或小刷清理进风口，勿用水冲洗带电路部分。}
  - {id: q42, q: 保修期多久, similar: [质保期], a: 具体保修期以购买凭证与当地保修政策为准，客服会根据订单为您核对。}
  - {id: q43, q: 怎么申请换货, a: 请提供订单号与购买渠道，客服核对后为您办理。}
  - {id: q44, q: 非官方渠道购买能保修吗, a: 需核对购买渠道与凭证后判断，客服会为您查询。}
  - {id: q45, q: 机器多久做一次全面保养, a: 建议每月一次：清理滚刷、边刷、滤网、尘盒、传感器与轮子。}
  - {id: q46, q: 轮子被头发缠住, a: 关机后用镊子或剪刀清理主轮与万向轮上的毛发。}
  - {id: q47, q: 机器在地毯边缘打转, a: 请修剪地毯流苏或设置禁区。}
  - {id: q48, q: 长时间不用怎么存放, a: 充电至 50% 左右后关机，存放在干燥阴凉处，每 3 个月补电一次。}
  - {id: q49, q: 传感器怎么清洁, a: 用干燥软布擦拭悬崖传感器、沿墙传感器与激光雷达窗口。}
  - {id: q50, q: 机器冒烟了, similar: [冒烟, 起火], a: 请立即断电停用并远离，联系售后处理，不要继续使用。}
