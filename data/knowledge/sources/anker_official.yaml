        query: Space One 电脑上音质突然变差 立体声和免提
      - id: c4
        title: 无线干扰引起的爆音
        anchor: USB 3.0
        summary: 爆音、噼啪声和间歇性静电噪声可能来自无线干扰：远离路由器、微波炉、其他正在工作的蓝牙设备和 USB 3.0 集线器，并把耳机保持在设备 3 米内、中间没有墙体或金属物。
        query: Space One 有噼啪爆音 是不是被干扰
      - id: c5
        title: 杂音场景对不上时的通用排查
        anchor: Test with a Different Device
        summary: 杂音在多个场景零星出现、对不上具体原因时，先在开机状态同时长按电源键和音量加键 5 秒恢复出厂；再换另一台手机或电脑测试，杂音消失说明问题在原设备；最后在 App 里检查固件更新。
        query: Space One 各种情况下都有杂音 怎么排查

