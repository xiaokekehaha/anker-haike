      - id: c2
        title: 左耳佩戴检测传感器
        anchor: wear detection sensor
        summary: 佩戴检测传感器在左耳罩内侧，被头发或衣物遮挡会导致左侧异常，包括误触发自动暂停，感觉像左耳不工作。传感器镜面脏污或起雾时用蘸酒精的棉签轻擦，不要用力以免划伤，也可在 App 里做佩戴校准。
        query: Space One 左耳老是自动暂停 传感器在哪
