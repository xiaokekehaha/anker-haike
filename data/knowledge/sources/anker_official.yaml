    product: X10 Pro Omni
    category: robot_vacuum
    sku_list: [EUFY-X10-PRO-OMNI]
    units:
      - id: c1
        title: 滚刷与滚刷护罩排查
        anchor: brush guard
        summary: 先关机，取下滚刷和滚刷护罩，检查吸口和护罩上的梳齿结构是否卡住碎屑。再不装这两个部件开机试运行，噪音消失说明问题就出在滚刷或护罩上。
        query: X10 Pro Omni 工作声音很大 滚刷护罩卡东西
      - id: c2
        title: 边刷与吸力档位判断
        anchor: side brush
        summary: 取下边刷后试运行，噪音停止说明来自边刷。再切换机器的吸力档位，噪音随档位明显变化说明与风机吸力有关。
        query: X10 Pro Omni 噪音是不是边刷引起的 换吸力档位
      - id: c3
