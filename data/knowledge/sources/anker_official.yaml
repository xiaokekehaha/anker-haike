        anchor: Filter Maintenance
        summary: 滤网严重堵塞会让机器更费力、噪音更大，按需清洗或更换以保证进风。再检查轮子里有没有卡住异物，手动转动轮子确认。任何维护前都要先关机。
        query: X10 Pro Omni 声音变大 滤网堵了 轮子卡东西

  - id: official_spaceone_power
    reviewed_source_sha256: b102b21f40a09ad558bc6c73690d9e99836477afea8f71d36d58ed879be661fe
    url: https://service.soundcore.com/article-description/How-to-Fix-soundcore-Space-One-Not-Turning-On-or-Unresponsive-Issues
    product: Space One A3035
    category: headphones
    sku_list: [SOUNDCORE-A3035]
    units:
      - id: c1
        title: 开机按法与自动关机
        anchor: power-on tone
        summary: 长按电源键 3 秒开机，会听到开机音和电量语音提示、指示灯白闪三次；短于 3 秒不算开机指令。未佩戴且没有音频播放时，降噪模式待机 1 小时、普通模式待机 30 分钟会自动关机，属正常行为。
        query: Space One 按电源键没反应 开机要按多久
      - id: c2
        title: 充电指示灯的三种状态
        anchor: 20 seconds
        summary: 红灯常亮表示正在正常充电，至少充 15 分钟再尝试开机；红灯不亮表示已充满或充电器没有供电；红灯每 20 秒闪一次表示电量极低，至少再充 30 分钟。
        query: Space One 充电红灯一直闪 是什么意思
      - id: c3
        title: 充电器功率与环境温度
        anchor: 560mA
        summary: 耳机充电电流为 530 至 560mA，应使用 5V/1A 及以上的认证充电器，功率不足会充不进电；用电脑 USB 口充电会明显更慢，满充约需 2 小时。充电环境温度须在 0 至 45°C 之间。
        query: Space One 用电脑USB充电很慢 要多大的充电器
      - id: c4
        title: 充电口与线材检查
        anchor: charging port
        summary: 检查 USB-C 充电口内有无灰尘、碎屑或异物，用干燥软毛刷或尖头棉签小心清理；进过液体的要先晾 24 小时再充电。再换一根线和另一个确认可用的充电器交叉测试。
        query: Space One 充电口有灰 换线还是充不进
      - id: c5
        title: 充电激活与恢复出厂设置
        anchor: Factory Reset
        summary: 充过电仍开不了机时，接 5V/1A 充电器充 5 秒后拔线，再手动按电源键开机。仍异常可在开机状态下同时长按电源键和音量加键 5 秒恢复出厂，指示灯红色慢闪三次表示已开始；恢复出厂后佩戴检测等设置会回到默认。
        query: Space One 怎么强制重启 恢复出厂设置会怎样
      - id: c6
        title: 电池长期保养
        anchor: once a month
        summary: 建议至少每月使用一次，长期保持零电量会造成过放并永久损伤电池容量；尽量在电量低于 20% 之前就充电；长期存放时每 6 个月充到 50% 至 70%。
        query: Space One 很久不用怎么保养电池

  - id: official_spaceone_disconnect
    reviewed_source_sha256: 42d3e7ba106440ddf0a3b2a3f7d0fdfa6caefb36662a23d9bd4b364a12b869da
