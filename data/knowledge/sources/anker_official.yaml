        anchor: ANC level
        summary: 安静环境下只在开降噪时听到的低频嗡嗡或嘶声，可在 App 里把降噪档位降低一到两级；再调整头梁和耳罩位置让耳垫完全贴合，密封不好会在低频环境噪声下产生嗡鸣；并用柔软干布或蓝丁胶清理耳罩外侧的降噪麦克风孔，不要用液体清洁剂。
        query: Space One 开降噪有嗡嗡声 底噪怎么减小
      - id: c2
        title: AUX 线连接时的电流声
        anchor: ground loop
        summary: 用 3.5mm AUX 线且所连设备同时在充电时出现持续电流声，最常见原因是充电回路把地环路干扰引入音频通路。拔掉该设备的充电线只用电池供电；必须边充边听时改用三脚接地插头。
        query: Space One 插AUX线有电流声 边充电边听
      - id: c3
        title: 立体声与免提模式导致音质突降
