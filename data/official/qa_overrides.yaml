# 对官方 Q&A 段落的人工审核结果（2026-10-09 第二批）。只改执行方式，原文不动；原文在 qa.yaml 里按生成文件约定不手改。
# 每条按 qa_id 与段落位置 pos（从 1 起，按原文出现顺序；原文编号会重复，如 bp-0123 的「Step 1:」与「1.」都是 1）定位。
# 可写：kind（question / action / statement / material_request / handoff）、options（question 的选项原文）、
# branches（选项 → 段落位置）、disabled + reason（已核实不适用的段落，不生成步骤但保留原文）。
bp-0123:
  1: {kind: statement}                                   # 「Identify the Problem」是标题
  3: {kind: question, options: ["Upon startup", "During breast pumping", "Only at high speed"]}
  9: {disabled: true, reason: "S1 Pro 为一体可穿戴结构，无外接软管；外接软管检查不适用（7.1 复核）"}
  10: {disabled: true, reason: "替换软管与奶瓶的交叉测试同上不适用（7.1 复核）"}
  11: {kind: handoff}
bp-0032:
  1: {kind: question, options: ["Breast shield opening", "Bottle connection"], branches: {"Breast shield opening": 2, "Bottle connection": 3}}
