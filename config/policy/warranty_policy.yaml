# 保修期与处置规则，2026-09-17 从三站公开售后政策页采集：
#   https://www.anker.com/policies/refund-policy
#   https://us.eufy.com/policies/refund-policy
#   https://www.soundcore.com/policies/refund-policy
# 每条规则的 source.quote 是页面原文，便于逐条复核。页面会变，改动请同步 fetched_at。
#
# 三级匹配（priority 定先后）：品类兜底 10 < 系列 20 < 部件或系列例外 30。
# 系列按子串认，语料是 series + sku + 目录里的产品名（见 app/policy/engine.py::_series_text）。
#
# 只写 US。页面原文写的是「The standard warranty period for each product in the United States…
# Warranty durations may vary by country, region」，别的区域没有采集到等价来源，
# 落到 no_policy_matched 转人工，不把美国站的月数按到别的区域上。
#
# 目录里这四个品类**故意没有规则**，因为公开政策页查不到对应行，判定一律转人工：
#   portable_power_station —— Anker 另有独立政策页 anker.com/anker-portable-power-station-warranty-policy，未采集
#   home_storage          —— 家用 / 阳台储能不在三站政策表内，售后走专业渠道
#   baby_monitor          —— eufy 政策表无对应行
#   uv_printer            —— eufyMake 不在三站政策表内
# 宁可转人工，也不编保修期。
version: 2026-09-17.1
source: public_site

common:
  regions: &us [US]
  channels: &channels [official_store, platform_store, authorized_dealer, unauthorized_dealer]

  # 官方处置阶梯：寄配件 → 维修 → 换翻新/新机 → 按使用时长部分退款。
  # 前三档公司承担且非退款，可自动办理；部分退款要人工核定金额。
  remedies: &remedies
  - {remedy: parts, when: {fault_class: [quality], within_warranty: true},
     cost_bearer: company, auto_allowed: true, clauses: [US-W-3.0]}
  - {remedy: repair, when: {fault_class: [quality], within_warranty: true},
     cost_bearer: company, auto_allowed: true, clauses: [US-W-3.1]}
  - {remedy: replace, when: {fault_class: [quality], within_warranty: true, not_prior: [replace]},
     cost_bearer: company, auto_allowed: true, clauses: [US-W-3.2, US-W-3.4]}
  - {remedy: refund, when: {fault_class: [quality], within_warranty: true},
     cost_bearer: company, auto_allowed: false, clauses: [US-W-3.3]}

  # 吸尘器类多一档：过保可付费维修（官方只对 RoboVac / HomeVac / Vacuum Cleaner 写了这条）。
  vacuum_remedies: &vacuum_remedies
  - {remedy: parts, when: {fault_class: [quality], within_warranty: true},
     cost_bearer: company, auto_allowed: true, clauses: [US-W-3.0]}
  - {remedy: repair, when: {fault_class: [quality], within_warranty: true},
     cost_bearer: company, auto_allowed: true, clauses: [US-W-3.1]}
  - {remedy: replace, when: {fault_class: [quality], within_warranty: true, not_prior: [replace]},
     cost_bearer: company, auto_allowed: true, clauses: [US-W-3.2, US-W-3.4]}
  - {remedy: refund, when: {fault_class: [quality], within_warranty: true},
     cost_bearer: company, auto_allowed: false, clauses: [US-W-3.3]}
  - {remedy: paid_repair, when: {fault_class: [quality], within_warranty: false},
     cost_bearer: customer, auto_allowed: false, clauses: [US-W-4.2]}

  # 安全风险不在这里：那是处置原则不是政策条款，由 engine 的 fault_safety 直接转人工。
  exclusions: &exclusions
  - {when: {fault_class: [user_damage]}, effect: no_free_remedy, clauses: [US-W-5.1]}
  - {when: {within_warranty: false}, effect: no_free_remedy, clauses: [US-W-4.1]}
  - {when: {channel: [unauthorized_dealer]}, effect: needs_human, clauses: [US-W-2.2]}

  cross_region: &cross_region
  - {when: {region_use_not_in: [US]}, effect: needs_human, clauses: [US-W-6.1]}

