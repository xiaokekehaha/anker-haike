# 检索编排开关（票 32，03 §1.4.1 / §1.4.2、09 §4.1）。
version: 2026-09-12.1
query_rewrite:
  enabled: false            # 无命中时的一次受控改写；启用前须完成人工标注样例对照（03 §1.4.2 启用门槛）
  max_query_chars: 200
  budget_ms: 3000           # rewrite invoke 上限；Router 内部尝试共用
  min_remaining_ms: 8000    # run 剩余不足 8 s 跳过补救（08 §8）
  # 已审核的同义表达映射：改写里出现左侧词视为与右侧原词等价，不算「新增部件 / 原因」
  synonyms:
    碎屑: [渣, 垃圾, 灰]
    残留: [还是有, 没扫干净, 扫不干净]
    清洁效果差: [扫不干净, 扫完还脏]
    吸力下降: [不吸, 吸不起, 吸力小, 吸力弱, 吸力变小]
    滚刷: [主刷, 刷子]
    边刷: [侧刷]
    滤网: [过滤网, 滤芯]
    尘盒: [垃圾盒, 集尘盒]
    扫地机器人: [扫地机, 扫拖机器人, 机器人]
retrieval:
  top_k: 5
  second_round_budget_ms: 3000   # 补检索整轮上限
  min_remaining_for_second_round_ms: 3000  # 剩余不足 3 s 跳过第二轮并记录（08 §8）
synthesize:
  budget_ms: 8000
  max_hypotheses: 3
