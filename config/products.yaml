# 产品目录 seed（票 19）。规则服务只在这里做型号精确 + 别名模糊匹配，不用模型猜型号（03 §1.3）。
# 2026-09-17 起按安克官网（anker.com.cn/brands）五大产品线组织品类：line 为产品线，name 为官网品类名。
# 深度品类（有 symptom_taxonomy / plans / fault_cards / 知识库）：扫地机器人、移动电源、充电器、无线耳机、音箱、家庭安防摄像头、吸奶器。
# 其余为目录品类：能识别、能记录，进入排障时按「缺少适用的排查资料」诚实结束（R5）。
# home_storage 例外（in_scope: false）：家用 / 阳台储能涉及电工安装与并网，售后走专业渠道，不做自助排障。
# aliases 是配置化别名表，进入 L4 内存缓存；比较时忽略大小写、空格与连字符。
# SKU 编码与型号名取自公开渠道，作演示种子，不保证与官方 SKU 一一对应。
version: 2026-09-17.2
categories:
  # ---- Anker Charging（移动电源与配件）----
  power_bank:       {name: 移动电源, line: Anker Charging, in_scope: true, keywords: [移动电源, 充电宝, 户外充电宝, 磁吸充电宝, power bank, powercore]}
  charger:          {name: 充电器, line: Anker Charging, in_scope: true, keywords: [充电器, 充电头, 快充头, 氮化镓, GaN, 适配器, charger]}
