# 读图受控词表（票 62；2026-09-15 阶段 1 起区分「其他」与「不可辨」；2026-09-17 起覆盖多品类部件）。
# 其他   = 看清楚了，但不属于本表任何一项（是个没见过的部件 / 没见过的现象）
# 不可辨 = 根本看不出来（模糊、被遮挡、画面里没有）
# 两者必须分开：合在一起会让「未知」被当成「已知的异常」，违反「宁可不知道，不可知道错」。
version: '2026-10-08.1'
# parts 是全部品类部件的并集，提示词整表给模型；品类归属见 category_parts。
parts: [滚刷, 边刷, 滤网, 尘盒, 吸口, 轮组, 传感器, 充电触点, 电池仓, 基站,
        接口, 数据线, 插脚, 电池, 外壳, 指示灯,
        耳机, 充电盒, 耳塞套,
        镜头, 支架, 太阳能板,
        喇叭罩, 鸭嘴阀, 隔膜, 导管, 奶瓶,
        其他, 不可辨]
# 「满」是 2026-09-15 字段级评测补进来的：三家模型一致把装满的尘盒描述成「正常 / 污渍」而不是「堵塞」，
# 而 plan 就叫 rv_suction_dustbin_full —— 缺词的是词表，不是模型。
# 「弯折」「锈蚀」是 2026-09-17 多品类补入：数据线折损、充电触点氧化是充电与耳机品类的常见可见现象。
phenomena: [缠绕, 堵塞, 满, 破损, 变形, 弯折, 烧焦, 漏液, 鼓包, 污渍, 锈蚀, 松脱, 缺失, 正常, 其他, 不可辨]
unknown: 不可辨
