# 路由唯一来源（model-selection.md §3.7）。真实模型 ID 于 2026-09-13 冻结（票 42）：DeepSeek 两款为本机实测，
# 其余为各厂商官方文档核对的当前 ID（本机无 key，通过率 / 延迟待 `make bakeoff` 补跑，见 docs/planning/2026-09-12_smart-service-bakeoff/）。
# providers.lane 标注厂商通道，domestic 链尾接 overseas 别名即跨通道降级。
# 规则：每个 task 的链上至少一家是当前环境可用的模型（只有 DEEPSEEK_API_KEY 时链不能整条 skipped，模型层 findings）。
# params 为厂商专属请求参数（openai 协议进 extra_body）：DeepSeek V4 默认开思考模式，关掉以免 reasoning token 计费与延迟翻倍。
version: 2026-09-13.1
default_lane: domestic

providers:
  anthropic: {sdk: anthropic, api_key_env: ANTHROPIC_API_KEY, lane: overseas}
  google:    {sdk: google_genai, api_key_env: GOOGLE_API_KEY, lane: overseas}
  dashscope: {sdk: openai, base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1", api_key_env: DASHSCOPE_API_KEY}
  deepseek:  {sdk: openai, base_url: "https://api.deepseek.com/v1", api_key_env: DEEPSEEK_API_KEY}
  zhipu:     {sdk: openai, base_url: "https://open.bigmodel.cn/api/paas/v4", api_key_env: ZHIPU_API_KEY}

models:
  sonnet:       {provider: anthropic, id: claude-sonnet-5,             vision: true,  structured: native,      max_images: 20, timeout_s: 20}
  haiku:        {provider: anthropic, id: claude-haiku-4-5-20251001,   vision: true,  structured: native,      max_images: 20, timeout_s: 15}
  gemini-flash: {provider: google,    id: gemini-2.5-flash,            vision: true,  structured: native,      max_images: 16, timeout_s: 20}
  qwen-flash:   {provider: dashscope, id: qwen3.7-flash,               vision: false, structured: json_object, timeout_s: 15}
  qwen-plus:    {provider: dashscope, id: qwen3.7-plus,                vision: false, structured: native,      timeout_s: 20}
  qwen-max:     {provider: dashscope, id: qwen3.8-max,                 vision: false, structured: native,      timeout_s: 20}
  qwen-vl:      {provider: dashscope, id: qwen3-vl-plus,               vision: true,  structured: json_object, max_images: 10, timeout_s: 30}
  # deepseek-flash（V4.1-Flash）实测：json_object 可用、能读图（max_images 按 4 张保守）、关思考后 intake ≈ 0.9 s
  deepseek:     {provider: deepseek,  id: deepseek-flash,              vision: true,  structured: json_object, max_images: 4,  timeout_s: 20, params: {thinking: {type: disabled}}}
  # deepseek-v4-pro：强推理档对照位（不读图，实测对图片凭空描述）；只作 synthesize / guide 的候选，默认不在链上
  deepseek-pro: {provider: deepseek,  id: deepseek-v4-pro,             vision: false, structured: json_object, timeout_s: 30, params: {thinking: {type: disabled}}}
  glm:          {provider: zhipu,     id: glm-4.7,                     vision: false, structured: native,      timeout_s: 20}
  glm-flash:    {provider: zhipu,     id: glm-4.7-flash,               vision: false, structured: native,      timeout_s: 15}
  glm-v:        {provider: zhipu,     id: glm-4.6v,                    vision: true,  structured: native,      max_images: 10, timeout_s: 30}
  embed-primary:  {provider: dashscope, id: text-embedding-v4, kind: embedding, dim: 1024}
  rerank-primary: {provider: dashscope, id: gte-rerank-v2, kind: rerank}

lanes:
  domestic:
    intake:                {chain: [qwen-flash, deepseek, haiku],       effort: low,    max_tokens: 512}
    disambiguate.clarify:  {chain: [qwen-flash, deepseek, glm-flash],   effort: low,    max_tokens: 256}
    diagnose.vision:       {chain: [qwen-vl, deepseek, sonnet],         effort: medium, needs_vision: true}
    diagnose.synthesize:   {chain: [qwen-max, deepseek, sonnet],        effort: high}
    guide.step:            {chain: [qwen-max, deepseek, sonnet],        effort: medium}
    reply.stream:          {chain: [qwen-plus, deepseek, glm-flash],    effort: low,    stream: true}
    escalate.summary:      {chain: [deepseek, qwen-flash],              effort: low}
    warranty.receipt_ocr:  {chain: [qwen-vl, deepseek, sonnet],         effort: low,    needs_vision: true}
    query.rewrite:         {chain: [qwen-flash, deepseek],              effort: low,    max_tokens: 128}  # 票 32：无命中一次改写，默认关闭（config/retrieval.yaml）
  overseas:
    intake:                {chain: [haiku, sonnet],                     effort: low,    max_tokens: 512}
    disambiguate.clarify:  {chain: [haiku, sonnet],                     effort: low}
    diagnose.vision:       {chain: [sonnet, gemini-flash],              effort: medium, needs_vision: true}
    diagnose.synthesize:   {chain: [sonnet, gemini-flash],              effort: high}
    guide.step:            {chain: [sonnet, haiku],                     effort: medium}
    reply.stream:          {chain: [sonnet, haiku],                     effort: low,    stream: true}
    escalate.summary:      {chain: [haiku, sonnet],                     effort: low}
    warranty.receipt_ocr:  {chain: [sonnet, gemini-flash],              effort: low,    needs_vision: true}
    query.rewrite:         {chain: [haiku, sonnet],                     effort: low,    max_tokens: 128}

# same_model_max：超时 / 5xx / schema 失败的同模型重试；rate_limit_max：429 专用（退避 1 / 2 / 4 s + 抖动）
retry: {same_model_max: 1, rate_limit_max: 3, chain_max: 3, sdk_max_retries: 0}
# 全局同时进行的模型调用上限，满则立即返回 error(recoverable=true)（07 §13）
concurrency: {max_in_flight: 50}
