# 区域与渠道枚举。
# 保修期表来自 anker.com / us.eufy.com / soundcore.com 的公开售后政策页，页面明确写着
# 「The standard warranty period for each product in the United States is listed in the chart below.
#   Warranty durations may vary by country, region…」，所以这些月数只对 US 成立。
# 其余区域没有采集到等价来源，warranty_policy.yaml 里就没有对应规则，判定落到 no_policy_matched →
# 转人工。宁可转人工，也不把美国站的月数按到别的区域上。
# 中国区无公开消费者售后政策页（anker.com.cn 是集团官网，销售走电商平台），同理。
regions:
- US
- CN
- EU
- DE
- FR
- IT
- ES
- NL
- UK
channels:
- official_store
- platform_store
- authorized_dealer
- unauthorized_dealer
aliases:
  美国: US
  中国: CN
  中国大陆: CN
  德国: DE
  英国: UK
  GB: UK
  欧盟: EU
  # 线上受理表单的渠道单选项（Order Verification）
  Anker Store: official_store
  soundcore Store: official_store
  eufy Store: official_store
  官方: official_store
  官方商城: official_store
  Amazon: platform_store
  eBay: platform_store
  Walmart: platform_store
  BestBuy: platform_store
  Target: platform_store
  平台: platform_store
  授权经销商: authorized_dealer
  非授权经销商: unauthorized_dealer
  海科演示授权经销商: authorized_dealer
  海科演示线上店: official_store
  海科演示未授权经销商: unauthorized_dealer
