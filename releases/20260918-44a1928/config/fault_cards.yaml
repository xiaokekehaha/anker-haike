# 故障卡（票 33，07 §7）：产品确认后预加载进 diagnose / guide 上下文的反范式化文本，离线由知识库生成并人工校对。
# 每张 ≤ 800 token（中文按字计）。faults 的 plan_id 必须是 plans.yaml 中的计划；keywords 用于与症状 / 查询做命中判断。
# key 为 SKU，或 "category:<category>" 供 category_only 使用。
version: 2026-09-17.2
cards:
  - key: category:robot_vacuum
    doc_version: 2026-09-12.1
    title: 扫地机器人通用故障卡
    faults:
      - {fault: 吸力下降 / 扫不干净, plan_id: rv_suction_hair_wrap, signatures: [{part: 滚刷, phenomenon: 缠绕}], symptom_codes: [suction_low], keywords: [不吸, 吸力, 扫不干净, 缠, 头发, 毛发, 渣], first_step: 翻转主机取出滚刷，清理缠绕的毛发后装回试运行}
      - {fault: 滤网堵塞, plan_id: rv_suction_filter_clog, signatures: [{part: 滤网, phenomenon: 堵塞}], symptom_codes: [filter_clog], keywords: [滤网, 滤芯, 灰尘多, 尘盒很快满], first_step: 取出滤网轻拍去尘并清水冲洗，晾干 24 小时装回}
      - {fault: 尘盒满或未装到位, plan_id: rv_suction_dustbin_full, signatures: [{part: 尘盒, phenomenon: 堵塞}], symptom_codes: [dustbin_full], keywords: [尘盒, 请检查尘盒, 漏灰], first_step: 倒空尘盒并重新安装到听到咔哒声}
      - {fault: 边刷缠绕或不转, plan_id: rv_suction_side_brush, signatures: [{part: 边刷, phenomenon: 缠绕}], symptom_codes: [side_brush_stuck], keywords: [边刷, 侧刷, 不转, 墙边], first_step: 关机后拆下边刷清理缠绕物}
      - {fault: 焦味 / 过热 / 冒烟（安全停用）, plan_id: rv_suction_motor_fault, keywords: [焦味, 过热, 发烫, 冒烟, 烧焦], first_step: 立即关机停止使用，等待人工处理}
      - {fault: 噪音变大（异物或缠绕）, plan_id: rv_noise_obstruction, symptom_codes: [abnormal_noise], keywords: [异响, 声音很大, 噪音大, 咔咔, 吱吱], first_step: 关机后检查吸口异物，再清理滚刷与边刷}
    safety:
      - 拆装滚刷、边刷、滤网前先关机。
      - 出现焦味、冒烟、机身过热或电池鼓包时立即断电停用并联系售后，不再自行排查。
      - 滤网必须完全晾干后装回，潮湿装回会损坏电机。
