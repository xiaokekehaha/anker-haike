# 症状词表（受控症状码 + 确定性判别题）。2026-09-17 起按品类分组：categories.<category>.{families, discriminators}。
# - expressions：用户口语到故障族的子串匹配（否定词 不是 / 没有 / 并非 前缀不算命中）。
# - discriminators：yes / no 二分题，两侧都必须覆盖到剩余候选才可用；没有可用判别题时直接让用户在剩余现象里多选。
# - selection_label：多选题里给用户看的说法（不写就用 fault_family）。
# - symptom_code 与 plans.yaml 的 symptom_codes 对应，按品类加前缀（rv_ 系列为历史沿用未加前缀）。
# 没有登记的品类（目录级品类）在 decide_symptoms 里走 question_coverage_missing → R5，不借用其他品类的问题。
version: 2026-09-19.1
source: 人工演示样本，待真实工单替换
categories:
  robot_vacuum:
    families:
    - fault_family: 吸力下降
      symptom_code: suction_low
      selection_label: 灰尘或颗粒吸不干净
      expressions:
      - 不吸了
      - 不吸
      - 吸力变小
      - 吸不干净
      - 扫不干净
      - 吸力变弱
      - 吸力下降
      # 图片路径早已有「滚刷+缠绕 → rv_suction_hair_wrap」的映射，这里把同一条已审核知识补给文字路径
      - 缠
      - 缠绕
      - 头发
      - 残留
    - fault_family: 不开机
      symptom_code: power_failure
      expressions: [不开机, 开不了机, 按了没反应, 无法启动, 启动不了, 无法开机, 开机没动静]
    - fault_family: 不充电
      symptom_code: charging_failure
      expressions: [不充电, 充不进电, 放回去没充上, 充电失败, 一直没电]
    - fault_family: 异响
      symptom_code: abnormal_noise
      expressions: [异响, 声音很大, 咔咔响, 吱吱响, 噪音大]
    - fault_family: 漏水
      symptom_code: water_leak
      expressions: [漏水, 底下有水, 水箱往外滴, 地上都是水, 往外渗水]
    - fault_family: 导航异常
      symptom_code: navigation_failure
      expressions: [乱跑, 撞来撞去, 到处乱撞, 地图乱了, 找不到基站, 回不去基站]
    - fault_family: 地图丢失
      symptom_code: map_lost
      selection_label: App 里看不到已保存的地图
      expressions: [地图没了, 地图丢了, 地图不见, 地图没保存, 地图被删]
    - fault_family: 拖地异常
      symptom_code: mop_failure
      selection_label: 拖地后仍有污渍或拖布异常
      expressions: [不拖地, 拖布不转, 拖地没水, 拖布不湿, 拖不干净]
    - fault_family: App 连接
      symptom_code: app_connection
      expressions: [连不上网, App离线, 连接失败, 配网失败, 老是掉线]
    discriminators:
    - question: 设备按电源后能正常启动吗？
      splits:
        'yes': [吸力下降, 异响, 漏水, 导航异常, 地图丢失, 拖地异常, App 连接]
        'no': [不开机, 不充电]
    - question: 放回基站后，设备有正常的充电指示或充电语音吗？
      splits:
        'yes': [不开机]
        'no': [不充电]
    - question: 是清扫或拖地的效果不好吗？
      splits:
        'yes': [吸力下降, 拖地异常]
        'no': [不开机, 不充电, 异响, 漏水, 导航异常, 地图丢失, App 连接]

  power_bank:
    families:
    - fault_family: 无法给设备充电
      symptom_code: pb_no_output
      selection_label: 插上手机等设备后不充电或没反应
      expressions: [充不了电, 不给手机充电, 插上没反应, 没有输出, 充不进手机, 给手机充不上, 不输出]
    - fault_family: 充电宝自身充不进电
      symptom_code: pb_no_input
      selection_label: 给充电宝本身充电时充不进 / 充不满
      expressions: [自己充不进, 充不进电, 充不满, 电量不涨, 一直充不满, 回充不了]
    # 「很慢」是性能异常，不是「充不进」；没有这个槽位时模型只能把它塞进邻近分类（会话 37cea3）。
    # 表达式只收带自身回充语境的说法，裸「很慢」交给模型按问诊上下文判断，避免把「给手机充电慢」也归到这里。
    - fault_family: 自身回充慢
      symptom_code: pb_slow_input
      selection_label: 给充电宝本身充电很慢
      expressions: [回充慢, 回充很慢, 回充太慢, 自己充得慢, 自身充电慢, 给充电宝充电慢, 给充电宝充电很慢, 充电宝充得慢, 充不快]
    - fault_family: 掉电快
      symptom_code: pb_battery_drain
      expressions: [掉电快, 电量虚, 用一会就没电, 续航短, 容量变小, 放着就没电]
    - fault_family: 发热异常
      symptom_code: pb_overheat
      expressions: [发烫, 很热, 过热, 烫手, 温度高]
    - fault_family: 指示灯异常
      symptom_code: pb_indicator_abnormal
      expressions: [指示灯一直闪, 灯一直闪, 灯闪, 灯不亮, 指示灯不亮, 一直在闪]
    - fault_family: 接口松动或损坏
      symptom_code: pb_port_damage
      expressions: [接口松, 插不紧, 接口坏了, 口松了, 接口松动, 插头晃]
    discriminators:
    - question: 插上手机或其他设备后，充电宝有输出反应吗（指示灯亮或设备显示充电）？
      splits:
        'yes': [充电宝自身充不进电, 自身回充慢, 掉电快, 发热异常, 指示灯异常]
        'no': [无法给设备充电, 接口松动或损坏]
    - question: 问题出现在给充电宝本身充电的时候吗？
      splits:
        'yes': [充电宝自身充不进电, 自身回充慢, 指示灯异常]
        'no': [无法给设备充电, 掉电快, 发热异常, 接口松动或损坏]

  charger:
    families:
    - fault_family: 不充电
      symptom_code: chg_no_output
      selection_label: 插上设备完全没有充电反应
      expressions: [不充电, 插上没反应, 充不了, 没输出, 不显示充电, 充不上]
    - fault_family: 充电慢
      symptom_code: chg_slow_charging
      expressions: [充电慢, 充得慢, 不快充, 速度慢, 功率上不去, 充得很慢]
    - fault_family: 发热异常
      symptom_code: chg_overheat
      expressions: [发烫, 很热, 过热, 烫手]
    - fault_family: 断断续续
      symptom_code: chg_intermittent
      expressions: [时断时续, 一会充一会不充, 断断续续, 充电中断, 老是断]
    - fault_family: 指示灯异常
      symptom_code: chg_indicator_abnormal
      expressions: [灯不亮, 灯闪, 指示灯不亮, 指示灯一直闪]
    - fault_family: 异响或异味
      symptom_code: chg_noise_smell
      expressions: [滋滋声, 有响声, 异响, 焦味, 异味, 有味道]
    discriminators:
    - question: 插上设备后是完全没有充电反应吗？
      splits:
        'yes': [不充电]
        'no': [充电慢, 发热异常, 断断续续, 指示灯异常, 异响或异味]
    - question: 充电能进行，只是速度慢或时断时续吗？
      splits:
        'yes': [充电慢, 断断续续]
        'no': [不充电, 发热异常, 指示灯异常, 异响或异味]

  earbuds:
    families:
    - fault_family: 单边无声
      symptom_code: eb_one_side_silent
      expressions: [一边没声, 只有一边, 单边, 左耳没声, 右耳没声, 一只没声音, 一边不响]
    - fault_family: 无法连接
      symptom_code: eb_pairing_failure
      expressions: [连不上, 配对失败, 搜不到, 蓝牙连不上, 断连, 老是断, 连接不上]
    - fault_family: 不充电
      symptom_code: eb_charging_failure
      expressions: [充不进电, 不充电, 充电盒不亮, 放回去不充, 充电仓不亮, 没电]
    - fault_family: 音量小或有杂音
      symptom_code: eb_low_volume
      selection_label: 声音小、发闷或有杂音
      expressions: [声音小, 音量小, 声音闷, 杂音, 有噪音, 电流声, 音质变差]
    - fault_family: 降噪无效
      symptom_code: eb_anc_failure
      expressions: [降噪没效果, 降噪不行, 降噪失效, 通透没用, 降噪没用]
    - fault_family: 触控失灵
      symptom_code: eb_touch_failure
      expressions: [触控没反应, 按了没反应, 触摸失灵, 点了没用, 触控失灵]
    discriminators:
    - question: 两只耳机都能连上手机并且都有声音吗？
      splits:
        'yes': [音量小或有杂音, 降噪无效, 触控失灵]
        'no': [单边无声, 无法连接, 不充电]
    - question: 把耳机放回充电盒后，充电盒或耳机的指示灯会亮吗？
      splits:
        'yes': [单边无声, 无法连接]
        'no': [不充电]

  speaker:
    families:
    - fault_family: 无法开机或充电
      symptom_code: spk_power_failure
      expressions: [开不了机, 不开机, 充不进电, 没反应, 按了没反应, 不充电]
    - fault_family: 蓝牙连不上
      symptom_code: spk_pairing_failure
      expressions: [连不上, 配对失败, 断连, 搜不到, 蓝牙连不上, 老是断]
    - fault_family: 没有声音或音量小
      symptom_code: spk_no_sound
      expressions: [没声音, 没有声音, 声音小, 音量小, 不出声]
    - fault_family: 杂音或破音
      symptom_code: spk_distortion
      expressions: [杂音, 破音, 电流声, 滋滋, 失真, 沙沙声]
    - fault_family: 续航短
      symptom_code: spk_battery_drain
      expressions: [掉电快, 续航短, 用一会就没电, 电量虚]
    - fault_family: 进水
      symptom_code: spk_water_damage
      expressions: [进水, 泡水, 淋雨, 掉水里, 进了水]
    discriminators:
    - question: 音箱能开机并和手机连上吗？
      splits:
        'yes': [没有声音或音量小, 杂音或破音, 续航短]
        'no': [无法开机或充电, 蓝牙连不上, 进水]
    - question: 音箱有出声，只是声音不正常吗？
      splits:
        'yes': [杂音或破音]
        'no': [没有声音或音量小, 续航短]

  security_cam:
    families:
    - fault_family: 设备离线
      symptom_code: cam_offline
      expressions: [离线, 掉线, 连不上, 配网失败, 断网, App离线, 不在线]
    - fault_family: 不录像或无推送
      symptom_code: cam_no_recording
      expressions: [不录像, 没录到, 没推送, 收不到通知, 不报警, 没有通知]
    - fault_family: 画面模糊或夜视异常
      symptom_code: cam_blurry
      selection_label: 画面模糊、发雾或夜视看不清
      expressions: [模糊, 看不清, 夜视不行, 画面黑, 起雾, 画面花, 夜视看不见]
    - fault_family: 续航短或不充电
      symptom_code: cam_battery_drain
      expressions: [掉电快, 续航短, 老是没电, 充不进电, 电量掉得快]
    - fault_family: 误报频繁
      symptom_code: cam_false_alarm
      expressions: [误报, 老是报警, 一直提醒, 乱报, 误触发]
    - fault_family: 门铃不响
      symptom_code: cam_doorbell_silent
      expressions: [门铃不响, 按了没声音, 室内机不响, 门铃没声]
    discriminators:
    - question: App 里这台设备当前显示在线吗？
      splits:
        'yes': [不录像或无推送, 画面模糊或夜视异常, 续航短或不充电, 误报频繁, 门铃不响]
        'no': [设备离线]
    - question: 问题是画面本身（模糊、发雾、夜视）吗？
      splits:
        'yes': [画面模糊或夜视异常]
        'no': [不录像或无推送, 续航短或不充电, 误报频繁, 门铃不响]

  breast_pump:
    families:
    - fault_family: 吸力不足
      symptom_code: bp_suction_weak
      expressions: [吸力小, 吸力变小, 吸力下降, 吸力不足, 没有吸力, 吸不出, 不吸, 吸力弱, 吸不了]
    - fault_family: 无法开机或充电
      symptom_code: bp_power_failure
      expressions: [开不了机, 不开机, 充不进电, 没电, 按了没反应, 不充电]
    - fault_family: 漏奶或漏气
      symptom_code: bp_leak
      expressions: [漏奶, 漏气, 往外漏, 密封不好, 漏出来]
    - fault_family: 异响
      symptom_code: bp_abnormal_noise
      expressions: [声音大, 异响, 噪音, 很响, 咔咔响]
    - fault_family: App 连接
      symptom_code: bp_app_connection
      expressions: [连不上App, App 连接失败, 蓝牙连不上, 连不上手机, 配对失败]
    discriminators:
    - question: 吸奶器能正常开机并运转吗？
      splits:
        'yes': [吸力不足, 漏奶或漏气, 异响, App 连接]
        'no': [无法开机或充电]
    - question: 运转时能听到马达声，只是吸力弱或漏吗？
      splits:
        'yes': [吸力不足, 漏奶或漏气]
        'no': [异响, App 连接]

  headphones:
    families:
    - fault_family: 无法开机或充电
      symptom_code: hd_power_failure
      expressions: [开不了机, 不开机, 充不进电, 没电, 按了没反应, 不充电, 开不起来]
    - fault_family: 连不上或频繁断连
      symptom_code: hd_pairing_failure
      expressions: [连不上, 配对失败, 搜不到, 蓝牙连不上, 断连, 老是断, 连接不上, 总掉线]
    - fault_family: 单边无声或左右不平衡
      symptom_code: hd_one_side_silent
      selection_label: 一边没声音，或左右音量不一样
      expressions: [一边没声, 只有一边, 单边, 左耳没声, 右耳没声, 一只没声音, 左右声音不一样, 声音偏一边]
    - fault_family: 杂音或底噪
      symptom_code: hd_noise
      selection_label: 有杂音、底噪或电流声
      expressions: [杂音, 底噪, 电流声, 滋滋, 嗡嗡, 啸叫, 噼啪, 爆音]
    - fault_family: 通话麦克风异常
      symptom_code: hd_mic_failure
      selection_label: 打电话时对方听不到或听不清
      expressions: [对方听不到, 对方听不清, 麦克风没声, 麦克风不行, 通话听不见, 收音差]
    - fault_family: 续航短
      symptom_code: hd_battery_drain
      expressions: [续航短, 掉电快, 用一会就没电, 不耐用, 电量掉得快]
    - fault_family: 降噪效果差
      symptom_code: hd_anc_failure
      expressions: [降噪没效果, 降噪不行, 降噪失效, 降噪没用, 隔音不好]
    discriminators:
    - question: 耳机能正常开机并连上手机或电脑吗？
      splits:
        'yes': [单边无声或左右不平衡, 杂音或底噪, 通话麦克风异常, 续航短, 降噪效果差]
        'no': [无法开机或充电, 连不上或频繁断连]
    - question: 问题只出现在打电话或语音通话的时候吗？
      splits:
        'yes': [通话麦克风异常]
        'no': [单边无声或左右不平衡, 杂音或底噪, 续航短, 降噪效果差]
    - question: 是听音乐时声音本身不对吗（单边、杂音或降噪）？
      splits:
        'yes': [单边无声或左右不平衡, 杂音或底噪, 降噪效果差]
        'no': [通话麦克风异常, 续航短]
