# 路由唯一来源（model-selection.md §3.7）。真实模型 ID 于 2026-09-13 冻结（票 42）：DeepSeek 与智谱 GLM 三款为本机实测，
# 其余（dashscope / anthropic / google）为官方文档核对的当前 ID，本机无 key，通过率 / 延迟待补跑（见 docs/planning/2026-09-12_smart-service-bakeoff/）。
# providers.lane 标注厂商通道，domestic 链尾接 overseas 别名即跨通道降级。
# 规则：每个 task 的链上至少一家是当前环境可用的模型（只有 DEEPSEEK_API_KEY 时链不能整条 skipped，模型层 findings）。
# params 为厂商专属请求参数（openai 协议进 extra_body）：DeepSeek V4 与智谱 GLM 默认开思考模式，关掉以免 reasoning token 计费与延迟翻倍。
# 2026-09-13 实测：百炼 qwen3.7-flash / qwen3.8-max 默认也开思考（enable_thinking），结构化调用返回空 content、synthesize 8 s 超时，需显式关闭。
# 2026-09-13.3（有界 RAG 阶段 5 / 6）：新增可选 task retrieve.grade（两通道）；query.rewrite max_tokens 128 → 512；
# 给 qwen-flash / qwen-plus / qwen-max 加 enable_thinking=false —— 实测百炼这三个位默认开思考，OpenAI 兼容接口下
# 结构化调用返回空 content，diagnose.synthesize 在 qwen-max 上 8 s 预算全部超时并降级到链尾，修复后 probe ≈ 1.2 s。
# 2026-09-13.2（票 42 两家实测）：domestic 每个 task 的链尾换成本机实测达标的智谱位，使「主备至少两家厂商」在只有
# DeepSeek + 智谱 key 的环境里也成立；未达标的候选不上链（glm 在 escalate.summary 10%、guide.step 89%，glm-flash 在
# synthesize 67%）。diagnose.vision 的 glm-v 只达备用位门槛（77% < 主 80%），但它是唯一有视觉能力的智谱模型。
version: 2026-09-13.3
default_lane: domestic

providers:
  anthropic: {sdk: anthropic, api_key_env: ANTHROPIC_API_KEY, lane: overseas}
  google:    {sdk: google_genai, api_key_env: GOOGLE_API_KEY, lane: overseas}
  dashscope: {sdk: openai, base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1", api_key_env: DASHSCOPE_API_KEY}
  deepseek:  {sdk: openai, base_url: "https://api.deepseek.com/v1", api_key_env: DEEPSEEK_API_KEY}
  zhipu:     {sdk: openai, base_url: "https://open.bigmodel.cn/api/paas/v4", api_key_env: ZHIPU_API_KEY}

models:
  sonnet:       {provider: anthropic, id: claude-sonnet-5,             vision: true,  structured: native,      max_images: 20, timeout_s: 20}
  haiku:        {provider: anthropic, id: claude-haiku-4-5-20251001,   vision: true,  structured: native,      max_images: 20, timeout_s: 15}
  gemini-flash: {provider: google,    id: gemini-2.5-flash,            vision: true,  structured: native,      max_images: 16, timeout_s: 20}
  qwen-flash:   {provider: dashscope, id: qwen3.7-flash,               vision: false, structured: json_object, timeout_s: 15, params: {enable_thinking: false}}
  qwen-plus:    {provider: dashscope, id: qwen3.7-plus,                vision: false, structured: native,      timeout_s: 20, params: {enable_thinking: false}}
  qwen-max:     {provider: dashscope, id: qwen3.8-max,                 vision: false, structured: native,      timeout_s: 20, params: {enable_thinking: false}}
  qwen-vl:      {provider: dashscope, id: qwen3-vl-plus,               vision: true,  structured: json_object, max_images: 10, timeout_s: 30}
  # deepseek-flash（V4.1-Flash）实测：json_object 可用、能读图（max_images 按 4 张保守）、关思考后 intake ≈ 0.9 s
  deepseek:     {provider: deepseek,  id: deepseek-flash,              vision: true,  structured: json_object, max_images: 4,  timeout_s: 20, params: {thinking: {type: disabled}}}
  # deepseek-v4-pro：强推理档对照位（不读图，实测对图片凭空描述）；只作 synthesize / guide 的候选，默认不在链上
  deepseek-pro: {provider: deepseek,  id: deepseek-v4-pro,             vision: false, structured: json_object, timeout_s: 30, params: {thinking: {type: disabled}}}
  # 智谱 2026-09-13 本机实测：json_schema 被静默忽略（返回散文 → 校验必失败），只能用 json_object；思考模式默认开，需关
  glm:          {provider: zhipu,     id: glm-4.7,                     vision: false, structured: json_object, timeout_s: 20, params: {thinking: {type: disabled}}}
  # glm-4.7-flash 不存在（调用返回 500 操作失败）；轻量档实测可用的是 glm-4.5-flash
  glm-flash:    {provider: zhipu,     id: glm-4.5-flash,               vision: false, structured: json_object, timeout_s: 15, params: {thinking: {type: disabled}}}
  glm-v:        {provider: zhipu,     id: glm-4.6v,                    vision: true,  structured: json_object, max_images: 10, timeout_s: 30, params: {thinking: {type: disabled}}}
  embed-primary:  {provider: dashscope, id: text-embedding-v4, kind: embedding, dim: 1024}
  rerank-primary: {provider: dashscope, id: gte-rerank-v2, kind: rerank}

lanes:
  domestic:
    intake:                {chain: [qwen-flash, deepseek, glm],       effort: low,    max_tokens: 512}
    disambiguate.clarify:  {chain: [qwen-flash, deepseek, glm-flash],   effort: low,    max_tokens: 256}
    diagnose.vision:       {chain: [qwen-vl, deepseek, glm-v],         effort: medium, needs_vision: true}
    diagnose.synthesize:   {chain: [qwen-max, deepseek, glm-v],        effort: high}
    guide.step:            {chain: [qwen-max, deepseek, glm-flash],  effort: medium}
    reply.stream:          {chain: [qwen-plus, deepseek, glm-flash],    effort: low,    stream: true}
    escalate.summary:      {chain: [deepseek, glm-v, qwen-flash],              effort: low}
    warranty.receipt_ocr:  {chain: [qwen-vl, deepseek, glm-v],         effort: low,    needs_vision: true}
    query.rewrite:         {chain: [qwen-flash, deepseek, glm],              effort: low,    max_tokens: 128}  # 票 32：无命中一次改写，默认关闭（config/retrieval.yaml）
    retrieve.grade:        {chain: [qwen-flash, deepseek, glm-flash],        effort: low,    max_tokens: 256}  # 有界 RAG 阶段 5：命中相关性评分，默认关闭（retrieval.yaml grade.enabled）。bake-off 2026-09-13：qwen-flash 98% 主、deepseek 100% 备、glm-flash 受账户限流未达标
  overseas:
    intake:                {chain: [haiku, sonnet],                     effort: low,    max_tokens: 512}
    disambiguate.clarify:  {chain: [haiku, sonnet],                     effort: low}
    diagnose.vision:       {chain: [sonnet, gemini-flash],              effort: medium, needs_vision: true}
    diagnose.synthesize:   {chain: [sonnet, gemini-flash],              effort: high}
    guide.step:            {chain: [sonnet, haiku],                     effort: medium}
    reply.stream:          {chain: [sonnet, haiku],                     effort: low,    stream: true}
    escalate.summary:      {chain: [haiku, sonnet],                     effort: low}
    warranty.receipt_ocr:  {chain: [sonnet, gemini-flash],              effort: low,    needs_vision: true}
    query.rewrite:         {chain: [haiku, sonnet],                     effort: low,    max_tokens: 128}
    retrieve.grade:        {chain: [haiku, sonnet],                     effort: low,    max_tokens: 256}

# same_model_max：超时 / 5xx / schema 失败的同模型重试；rate_limit_max：429 专用（退避 1 / 2 / 4 s + 抖动）
retry: {same_model_max: 1, rate_limit_max: 3, chain_max: 3, sdk_max_retries: 0}
# 全局同时进行的模型调用上限，满则立即返回 error(recoverable=true)（07 §13）
concurrency: {max_in_flight: 50}
