version: '2026-09-14.1'
strategies:
  normal: {tone: direct, pace: normal, actions: [], prompt: '用户情绪平稳：直接、简洁地回应，每次只给一个可执行动作。'}
  reassure_first: {tone: warm, pace: normal, actions: [], prompt: '先简短安抚，再说明下一步，不做无法兑现的承诺。'}
  reassure_and_shorten: {tone: warm, pace: fast, actions: [shorten_steps], prompt: '先回应用户的不满，缩短解释，每次只给一个必要步骤。'}
  direct_resolution: {tone: apologetic, pace: fast, actions: [skip_optional_clarify, prefer_proposal_over_more_steps], prompt: '承认用户已经付出的时间，优先提供可执行的解决方案，仅追问必要信息。'}
  de_escalate_and_offer_human: {tone: apologetic, pace: fast, actions: [offer_human, flag_complaint_risk, prefer_proposal_over_more_steps, suggest_compensation_review], prompt: '简短致歉，提供人工协助或政策允许的处理方案，不继续重复排障，不承诺补偿金额。'}
rules:
  - {when: {level: complaint_risk}, strategy: de_escalate_and_offer_human}
  - {when: {level: angry, trend: rising}, strategy: de_escalate_and_offer_human}
  - {when: {level: angry}, strategy: direct_resolution}
  - {when: {level: dissatisfied, unresolved_turns_gte: 3}, strategy: direct_resolution}
  - {when: {level: dissatisfied}, strategy: reassure_and_shorten}
  - {when: {risk: true}, strategy: reassure_first}
  - {when: {}, strategy: normal}
