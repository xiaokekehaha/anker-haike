# 虚构演示，待真实 SOP 替换。
version: 2026-09-14.1
source: demo
policies:
- policy_id: cn_robot_vacuum_standard
  priority: 10
  applies_to:
    category: robot_vacuum
    region_purchase: &id001
    - CN
    channel: &id002
    - official_store
    - platform_store
    - authorized_dealer
    - unauthorized_dealer
  warranty_months: 12
  remedies:
  - remedy: repair
    when:
      fault_class:
      - quality
      within_warranty: true
    cost_bearer: company
    auto_allowed: true
    clauses:
    - CN-W-3.1
  - remedy: replace
    when:
      fault_class:
      - quality
      within_warranty: true
      not_prior:
      - replace
    cost_bearer: company
    auto_allowed: true
    clauses:
    - CN-W-3.2
  - remedy: refund
    when:
      fault_class:
      - quality
      days_since_purchase_lte: 7
    cost_bearer: company
    auto_allowed: false
    clauses:
    - CN-W-3.3
  - remedy: repair
    when:
      fault_class:
      - quality
      within_warranty: false
    cost_bearer: customer
    auto_allowed: false
    clauses:
    - CN-W-4.1
  exclusions:
  - when:
      fault_class:
      - user_damage
    effect: no_free_remedy
    clauses:
    - CN-W-5.1
  - when:
      channel:
      - unauthorized_dealer
    effect: needs_human
    clauses:
    - CN-W-2.2
  - when:
      fault_class:
      - safety
    effect: needs_human
    clauses:
    - CN-W-S1
  cross_region:
  - when:
      region_use_not_in: *id001
    effect: needs_human
    clauses:
    - CN-W-6.1
