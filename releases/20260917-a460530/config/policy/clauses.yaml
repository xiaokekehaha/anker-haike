# 条款来自三站公开售后政策页，2026-09-17 采集。text 是中文转述，quote 原文留在
# warranty_policy.yaml 的 source.quote 里。页面会变，doc_version 即采集日期。
# 安全风险转人工不在这里：那是处置原则不是政策条款，由 engine 的 fault_safety 与
# config/rules/safety_terms.yaml 负责，不伪造条款引用。
clauses:
  US-W-3.0:
    text: 质量问题的处置阶梯第一档是提供更换配件。
    source_doc: eufy Warranty Policy (US)
    source_url: https://us.eufy.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-3.1:
    text: 质量问题保内可由公司维修。
    source_doc: eufy Warranty Policy (US)
    source_url: https://us.eufy.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-3.2:
    text: 质量问题保内可换货：有翻新机时先给同等价值的翻新机，没有时给新机。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-3.3:
    text: 无法更换或客户不愿更换时，按设备已使用时长给部分退款，需人工核定金额。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-3.4:
    text: 换货件的保修期取「原保修剩余期」与「换货后三个月」中较长者。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-4.1:
    text: 超出保修期的产品不在免费保修范围内。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-4.2:
    text: 过保的扫地机器人 / 手持吸尘器可申请付费维修，费用由客户承担。
    source_doc: eufy Warranty Policy (US)
    source_url: https://us.eufy.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-5.1:
    text: 误用造成的损坏不保，包括跌落、极端温度、进液和不当操作。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-2.2:
    text: 非授权经销商处购买的产品不在保修范围内，需人工核实购买渠道。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
  US-W-6.1:
    text: 保修仅在原购买国有效，产品被带出购买国或国际转运后保修失效，需人工核实。
    source_doc: Anker Return and Refund Policy (US)
    source_url: https://www.anker.com/policies/refund-policy
    doc_version: '2026-09-17'
