# 故障卡（票 33，07 §7）：产品确认后预加载进 diagnose / guide 上下文的反范式化文本，离线由知识库生成并人工校对。
# 每张 ≤ 800 token（中文按字计）。faults 的 plan_id 必须是 plans.yaml 中的计划；keywords 用于与症状 / 查询做命中判断。
# key 为 SKU，或 "category:<category>" 供 category_only 使用。
version: 2026-09-12.1
cards:
  - key: category:robot_vacuum
    doc_version: 2026-09-12.1
    title: 扫地机器人通用故障卡
    faults:
      - {fault: 吸力下降 / 扫不干净, plan_id: rv_suction_hair_wrap, keywords: [不吸, 吸力, 扫不干净, 缠, 头发, 毛发, 渣], first_step: 翻转主机取出滚刷，清理缠绕的毛发后装回试运行}
      - {fault: 滤网堵塞, plan_id: rv_suction_filter_clog, keywords: [滤网, 滤芯, 灰尘多, 尘盒很快满], first_step: 取出滤网轻拍去尘并清水冲洗，晾干 24 小时装回}
      - {fault: 尘盒满或未装到位, plan_id: rv_suction_dustbin_full, keywords: [尘盒, 请检查尘盒, 漏灰], first_step: 倒空尘盒并重新安装到听到咔哒声}
      - {fault: 边刷缠绕或不转, plan_id: rv_suction_side_brush, keywords: [边刷, 侧刷, 不转, 墙边], first_step: 关机后拆下边刷清理缠绕物}
      - {fault: 异响 / 焦味 / 过热, plan_id: rv_suction_motor_fault, keywords: [异响, 焦味, 过热, 发烫, 冒烟], first_step: 立即关机停止使用，等待人工处理}
    safety:
      - 拆装滚刷、边刷、滤网前先关机。
      - 出现焦味、冒烟、机身过热或电池鼓包时立即断电停用并联系售后，不再自行排查。
      - 滤网必须完全晾干后装回，潮湿装回会损坏电机。
  - key: EUFY-X10-PRO-OMNI
    doc_version: 2026-09-12.1
    title: eufy X10 Pro Omni 故障卡
    faults:
      - {fault: 吸力下降（滚刷缠绕）, plan_id: rv_suction_hair_wrap, keywords: [不吸, 吸力, 缠, 头发, 毛发, 滚刷], first_step: 按下滚刷盖两侧卡扣取出滚刷，用清洁刀具割断缠绕毛发，清理两端轴承后装回}
      - {fault: 滤网堵塞, plan_id: rv_suction_filter_clog, keywords: [滤网, 灰], first_step: 打开尘盒盖取出滤网清洗，晾干 24 小时}
      - {fault: 「请检查尘盒」提示, plan_id: rv_suction_dustbin_full, keywords: [尘盒, 提示], first_step: 按尘盒释放键抽出尘盒倒空，检查进风口后装回到位}
      - {fault: 边刷不转, plan_id: rv_suction_side_brush, keywords: [边刷, 不转], first_step: 拆下边刷螺丝清理缠绕物，刷毛变形则更换}
      - {fault: 异响 / 焦味 / 过热, plan_id: rv_suction_motor_fault, keywords: [异响, 焦味, 过热, 冒烟], first_step: 立即关机停用并联系售后}
    safety:
      - 基站清洗拖布时勿伸手进入基站底部。
      - 出现焦味、冒烟、过热或电池鼓包立即断电停用，不要继续充电。
  - key: EUFY-X9-PRO
    doc_version: 2026-09-12.1
    title: eufy X9 Pro 故障卡
    faults:
      - {fault: 吸力下降（滚刷缠绕）, plan_id: rv_suction_hair_wrap, keywords: [不吸, 吸力, 缠, 头发, 毛发, 滚刷], first_step: 取出滚刷割断缠绕毛发，清理两端轴承后装回，听到咔哒声}
      - {fault: 滤网堵塞, plan_id: rv_suction_filter_clog, keywords: [滤网, 灰], first_step: 取出滤网清洗并晾干 24 小时}
      - {fault: 尘盒未装到位, plan_id: rv_suction_dustbin_full, keywords: [尘盒, 提示], first_step: 倒空尘盒并重新安装到位}
      - {fault: 边刷不转, plan_id: rv_suction_side_brush, keywords: [边刷, 不转], first_step: 拆下边刷清理缠绕物}
      - {fault: 异响 / 焦味 / 过热, plan_id: rv_suction_motor_fault, keywords: [异响, 焦味, 过热, 冒烟], first_step: 立即关机停用并联系售后}
    safety:
      - 拖布模块拆装前先关机；水箱勿加清洁剂以外的液体。
      - 出现焦味、冒烟、过热或电池鼓包立即断电停用。
  - key: EUFY-S1-PRO
    doc_version: 2026-09-12.1
    title: eufy S1 Pro 扫地机器人故障卡
    faults:
      - {fault: 吸力下降（滚刷缠绕）, plan_id: rv_suction_hair_wrap, keywords: [不吸, 吸力, 缠, 头发, 毛发, 滚刷], first_step: 取出滚刷清理缠绕毛发后装回试运行}
      - {fault: 滤网堵塞, plan_id: rv_suction_filter_clog, keywords: [滤网], first_step: 取出滤网清洗并完全晾干}
      - {fault: 尘盒满或未装到位, plan_id: rv_suction_dustbin_full, keywords: [尘盒], first_step: 倒空尘盒并装回到位}
      - {fault: 边刷不转, plan_id: rv_suction_side_brush, keywords: [边刷, 不转], first_step: 关机拆下边刷清理}
      - {fault: 异响 / 焦味 / 过热, plan_id: rv_suction_motor_fault, keywords: [异响, 焦味, 过热, 冒烟], first_step: 立即关机停用并联系售后}
    safety:
      - 基站工作时勿移动主机；出现焦味、冒烟、过热立即断电停用。
  - key: EUFY-L60-HYBRID
    doc_version: 2026-09-12.1
    title: eufy L60 Hybrid 故障卡
    faults:
      - {fault: 吸力下降（滚刷缠绕）, plan_id: rv_suction_hair_wrap, keywords: [不吸, 吸力, 缠, 头发, 毛发, 滚刷], first_step: 扳开滚刷盖卡扣取出滚刷，清理缠绕物与末端轴套}
      - {fault: 滤网堵塞, plan_id: rv_suction_filter_clog, keywords: [滤网], first_step: 取出可水洗滤网冲洗并完全晾干}
      - {fault: 尘盒盖未扣紧 / 已满, plan_id: rv_suction_dustbin_full, keywords: [尘盒, 漏灰], first_step: 倒空尘盒并扣紧尘盒盖}
      - {fault: 边刷不转, plan_id: rv_suction_side_brush, keywords: [边刷, 不转], first_step: 关机拆下边刷清理}
      - {fault: 异响 / 焦味 / 过热, plan_id: rv_suction_motor_fault, keywords: [异响, 焦味, 过热, 冒烟], first_step: 立即关机停用并联系售后}
    safety:
      - 水箱漏水时先检查密封圈；出现焦味、冒烟、过热立即断电停用。
