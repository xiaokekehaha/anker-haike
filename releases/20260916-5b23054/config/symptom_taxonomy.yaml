version: 2026-09-14.2
category: robot_vacuum
source: 人工演示样本，待真实工单替换
families:
- fault_family: 吸力下降
  symptom_code: suction_low
  expressions:
  - 不吸了
  - 不吸
  - 吸力变小
  - 吸不干净
  - 扫不干净
  - 吸力变弱
  - 吸力下降
- fault_family: 不开机
  symptom_code: power_failure
  expressions:
  - 不开机
  - 开不了机
  - 按了没反应
  - 无法启动
  - 启动不了
  - 无法开机
  - 开机没动静
- fault_family: 不充电
  symptom_code: charging_failure
  expressions:
  - 不充电
  - 充不进电
  - 放回去没充上
  - 充电失败
  - 一直没电
- fault_family: 异响
  symptom_code: abnormal_noise
  expressions:
  - 异响
  - 声音很大
  - 咔咔响
  - 吱吱响
  - 噪音大
- fault_family: 漏水
  symptom_code: water_leak
  expressions:
  - 漏水
  - 底下有水
  - 水箱往外滴
  - 地上都是水
  - 往外渗水
- fault_family: 导航异常
  symptom_code: navigation_failure
  expressions:
  - 乱跑
  - 撞来撞去
  - 地图乱了
  - 找不到基站
  - 回不去基站
- fault_family: 拖地异常
  symptom_code: mop_failure
  expressions:
  - 不拖地
  - 拖布不转
  - 拖地没水
  - 拖布不湿
  - 拖不干净
- fault_family: App 连接
  symptom_code: app_connection
  expressions:
  - 连不上网
  - App离线
  - 连接失败
  - 配网失败
  - 老是掉线
discriminators:
- question: 设备按电源后能正常启动吗？
  splits:
    'yes':
    - 吸力下降
    - 异响
    - 漏水
    - 导航异常
    - 拖地异常
    - App 连接
    'no':
    - 不开机
    - 不充电
- question: 放回基站后，设备有正常的充电指示或充电语音吗？
  splits:
    'yes':
    - 不开机
    'no':
    - 不充电
- question: 是清扫或拖地的效果不好吗？
  splits:
    'yes':
    - 吸力下降
    - 拖地异常
    'no':
    - 不开机
    - 不充电
    - 异响
    - 漏水
    - 导航异常
    - App 连接
